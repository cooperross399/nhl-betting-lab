name: Saves Model Study

# Does the favourite, home ice and tonight's two teams make a better goalie
# saves projection, walk-forward on outcomes and against the bought saves
# prices? (Cooper, 2026-10-20.) See scripts/run_saves_model_study.py.
#
# It fetches no odds, spends no credit, places no bet, pushes nothing,
# uploads nothing and edits no policy. The bought prices are restored onto
# the runner and never leave it; the result is aggregate and goes to the run
# summary only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_saves_model_study.py"
      - ".github/workflows/saves-model-study.yml"
      - "src/nhl_betting_lab/models/saves_context.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: saves-model-study
  cancel-in-progress: false

jobs:
  measure:
    name: Saves Model Study
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores and the bought prices
        # As Experiment Refresh restores them. Bought prices cannot be
        # regenerated, so their absence stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          if [ ! -s data/processed/historical_prop_prices.csv ] || [ ! -s data/processed/historical_team_prices.csv ]; then
            echo "::error::The bought prop prices did not restore (they expire from CI on 2026-11-29), so there is nothing to price against."
            exit 1
          fi
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Measure every saves variant
        env:
          PYTHONPATH: src
        run: |
          set -u
          status=0
          python scripts/run_saves_model_study.py || status=$?
          if [ -s data/outputs/saves_model_study.md ]; then
            cat data/outputs/saves_model_study.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # The bought prices leave the workspace before the job ends.
          rm -f data/processed/historical_prop_prices.csv data/processed/historical_team_prices.csv
          exit "$status"
