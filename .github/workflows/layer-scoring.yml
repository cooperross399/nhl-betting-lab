name: Layer Scoring

# Scores each model layer added from 2026-10-22 on the settled live picks
# (Cooper, 2026-11-09: "Yes do all 4"). See scripts/run_layer_scoring.py.
#
# Weekly since 2026-11-10 (Cooper: "All"): every Monday at 00:30 UTC, which
# is Sunday evening in New York, so even a start eight hours late finishes
# well before the 13:30 UTC card. Gameday Refresh restores the newest
# `layer-scoring` artifact, the Monday card carries a "Layer scorecard"
# section (`nhl_betting_lab.layer_scorecard`), and card-feed carries the full
# report as latest_layer_scoring.md.
#
# It fetches no odds, spends no credit, places no bet, pushes nothing, edits
# no policy and changes nothing the card prices or stakes: the scorecard is a
# report, and cutting a layer stays a human call. It uploads only its own
# report (`layer-scoring`: layer_scoring.md and .json), which is aggregate
# (bets, units, ROI, intervals), never a price, line or book.
on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_layer_scoring.py"
      - ".github/workflows/layer-scoring.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: layer-scoring
  cancel-in-progress: false

jobs:
  measure:
    name: Layer Scoring
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the ledger, the logs and the frozen boards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          python scripts/restore_state.py --artifact gameday-state --dest data \
            --workflow gameday-refresh.yml --no-merge --refuse-unreachable --attempts 3 || {
            echo "::error::GitHub could not be reached to restore gameday-state."
            exit 1
          }
          mkdir -p dist/data/history
          python scripts/restore_state.py --artifact site-history --dest dist/data/history \
            --workflow publish-site.yml --success-only --no-merge --refuse-unreachable --attempts 3 || {
            echo "::error::GitHub could not be reached to restore site-history."
            exit 1
          }
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Score every layer
        env:
          PYTHONPATH: src
        run: |
          set -u
          status=0
          python scripts/run_layer_scoring.py --history-dir dist/data/history || status=$?
          if [ -s data/outputs/layer_scoring.md ]; then
            cat data/outputs/layer_scoring.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Keep the report for the Monday card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-scoring
          path: |
            data/outputs/layer_scoring.md
            data/outputs/layer_scoring.json
          if-no-files-found: warn
          retention-days: 30
