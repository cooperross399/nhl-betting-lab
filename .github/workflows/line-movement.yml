name: Line Movement Capture

# Collects what a single daily snapshot cannot show: how prices move, and
# when the lineup that moves them becomes public.
#
# WHY THIS EXISTS. After the model was measured to have no edge, three ideas
# remained. Two of them — a book leaving its alternate ladder behind when it
# moves the main line, and a book lagging the market on lineup news — are
# untestable on everything this lab owns, for the same reason: every price it
# has ever held was taken once, four hours before puck drop. Movement cannot
# be seen in one observation.
#
# Like forward evidence, this cannot be collected retroactively. A night that
# is not captured is gone, so it runs through the season and the analysis
# waits.
#
# SCOPE: it writes only under data/processed/line_movement/. It does not touch
# data/staging/ (which the card reads), the forward ledger, the policy, or the
# card. It places no bet, allowlists nothing, and decides nothing.
#
# COST: 19 per-event markets across a night's games, several times a day —
# roughly a thousand credits on a busy day, against a monthly allowance in the
# millions. The cap is still hard, because an unbounded fetch is how a quota
# becomes a bill.
on:
  schedule:
    # Through the day and across every time zone's puck drop, so a line has
    # somewhere to move between observations. In season only.
    #
    # EACH CRON FIRES EIGHT HOURS BEFORE ITS ROUND, and the run waits for the
    # round (the `wait` jobs below; scripts/wait_for_round.py). The rounds
    # are 14:00, 18:00, 21:00, 23:00 and 01:00 UTC. GitHub starts this
    # repository's scheduled runs hours late (3.5-4.2 h on 2026-09-24,
    # 5.5-6.0 h on 2026-09-28), and a cron written at its round landed at or
    # after 7pm ET face-off, so no evening game could close; the 23:00 round
    # landed past midnight in New York and captured the wrong day. Lateness
    # up to eight hours now costs nothing. Moving a round means moving its
    # cron to eight hours before it.
    - cron: "0 6 * 1-4,10-12 *"
    - cron: "0 10 * 1-4,10-12 *"
    - cron: "0 13 * 1-4,10-12 *"
    - cron: "0 15 * 1-4,10-12 *"
    - cron: "0 17 * 1-4,10-12 *"
    # Opening week does not wait for October, and it gets every round: the
    # 17:00 cron on 30 September is the 01:00 round on 1 October, which
    # closes 30 September's late starts. One cron per round: the wait reads
    # a single hour from the cron that fired.
    - cron: "0 6 29-30 9 *"
    - cron: "0 10 29-30 9 *"
    - cron: "0 13 29-30 9 *"
    - cron: "0 15 29-30 9 *"
    - cron: "0 17 29-30 9 *"
  workflow_dispatch:
    inputs:
      credit_cap:
        description: "Hard cap on credits for this capture"
        type: string
        required: false
        default: "600"
      at:
        description: >-
          UTC time to capture at, as HH:MM or 2026-09-29T21:30Z (at most 11
          hours ahead). Blank captures now.
        type: string
        required: false
        default: ""
      rehearse_lines:
        description: >-
          Fetch line combinations even with no games today. Proves a GitHub
          runner can still reach the source; costs no provider credits.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # Hold the run until its round. Two jobs, because one may run for at most
  # six hours and a round can be eight away; each waits at most 340 minutes
  # and the second recomputes the round from the same cron. They check out
  # the repository for the script and nothing else: no install, no secret,
  # no credit.
  wait:
    name: Wait for the round
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the round
        env:
          SCHEDULE: ${{ github.event.schedule }}
          AT: ${{ inputs.at }}
        run: python3 scripts/wait_for_round.py --schedule "$SCHEDULE" --at "$AT" --budget-minutes 340

  wait-more:
    name: Wait for the round (continued)
    needs: wait
    # A wait that failed must not cost the round: capture late rather than not at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the round
        env:
          SCHEDULE: ${{ github.event.schedule }}
          AT: ${{ inputs.at }}
        run: python3 scripts/wait_for_round.py --schedule "$SCHEDULE" --at "$AT" --budget-minutes 340

  capture:
    name: Capture
    needs: wait-more
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On the job, not the workflow: runs wait for hours and overlap, and a
    # workflow-level group would keep only one of them pending, cancelling the
    # rounds between. Captures still never run two at once, so a restore
    # always reads the previous round's upload.
    concurrency:
      group: line-movement
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore today's captures
        # Each capture appends to the day's file, so the day's earlier
        # captures have to come back or every run writes the first line of a
        # new file and the movement is lost.
        #
        # FROM THE NEWEST RUN THAT CARRIES THEM, WHATEVER ITS CONCLUSION. This
        # used to restore `gh run list --status success --limit 1`. A run goes
        # red when the price capture's events list fails or when the line
        # units or the scratch list were not captured (the gates at the end),
        # and either way the steps marked `if: always()` still captured and
        # uploaded: the deployment and line units on a price failure, the
        # prices and the deployment on a line failure, the prices and the line
        # units on a scratch-list failure. The next restore skipped such a
        # run, so its rows fell out of the chain; in the failure-shape
        # audit's replay (14:00 green, 18:00 red, 21:00 green) the 18:00
        # scratch list and PP1 promotion were first seen at 21:00, three hours
        # late, and neither source keeps an archive. `--union 3` then folds
        # in, row by row, what the two carriers before the newest hold that it
        # lacks, so a run whose own restore found nothing cannot become the
        # base the season is lost from. See scripts/restore_state.py.
        #
        # A RESTORE THAT COULD NOT ASK GITHUB IS A RED RUN. This made one
        # attempt at each call, named no --problem-file, and turned any
        # failure into a ::warning::, so a failed `gh run list` started every
        # day file afresh, uploaded a carrier holding this round alone, and
        # finished green. The union reads the newest carrier and the two
        # before it, so three such runs in a row (three 502s, or seven hours
        # of listing failures at five runs a day) and the next run unioned
        # three thin carriers and never read an older one: every earlier
        # capture, yesterday's and the season's, left the chain for good
        # with every run green (sweep 5, line-movement-three-thin-carriers-
        # drop-the-season). Now each call is tried three times, as Gameday
        # Refresh's restore is, and whatever still could not be reached is
        # written to restore_problem.txt, which the last gate reads after
        # every upload and turns into a red run. One thin run is then seen
        # the day it happens, not after the third. Free: GitHub's API only.
        #
        # BOUNDED, BECAUSE THE PAID FETCH COMES AFTER IT. Three attempts
        # pause 10 s + 20 s after each failed call, and the restore walks the
        # listed runs, so an artifact outage across a --limit 30 walk sleeps
        # about 15 minutes of the job's 20 before "Capture prices": the job
        # could be cancelled during or after the fetch, credits spent and
        # nothing written. --limit 10 still spans the union's three carriers
        # and the cancelled runs between them, and the step is cut at five
        # minutes. continue-on-error keeps the capture running either way;
        # a timed-out restore writes nothing to the problem file, so the gate
        # at the end reads this step's outcome (`id: restore`) too.
        id: restore
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          DAY=$(TZ=America/New_York date +%F)
          mkdir -p data/processed
          : > restore_problem.txt
          python scripts/restore_state.py --artifact line-movement --dest data/processed \
            --workflow line-movement.yml --union 3 --limit 10 \
            --attempts 3 --problem-file restore_problem.txt \
            || {
              echo "::warning::The previous captures could not be restored; this run starts the day's files afresh."
              echo "restore_state.py exited non-zero, so the previous captures were not restored." >> restore_problem.txt
            }
          for store in line_movement deployment line_combinations; do
            ls -la "data/processed/$store/$DAY.csv" 2>/dev/null \
              || echo "No $store file for $DAY yet; this run starts it."
          done

      - name: Cache the club schedules
        # For the preseason screen in the next step. The capture spends its
        # cap front-to-back in face-off order, and from 2026-09-29 into early
        # October the board holds exhibition games that face off first; the
        # screen drops the games the regular-season schedule does not know
        # before the cap is spent. This runner restores only its own
        # captures, so without this step there is no schedule and the screen
        # abstains. The club schedules also carry every club's name, which
        # is how the screen resolves the board with no boxscore cache here.
        #
        # Free: the NHL API, as the deployment and line-combination steps
        # below already use. It spends no provider credit. Never fatal: a
        # failed or partial fetch leaves the cache incomplete, the screen
        # abstains on that and says so, and the capture runs unscreened.
        # Never slow enough to cost the capture either: a hanging API
        # retries 4 x 30 s for each of 32 clubs, about 71 minutes, and the
        # job's 20-minute limit would cancel the run before "Capture prices".
        # Three minutes is ten times a healthy fetch; continue-on-error
        # covers the timeout too.
        timeout-minutes: 3
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_nhl_data.py --schedules-only --polite-seconds 0.25

      - name: Capture prices
        # The script reports on itself. It exits 0 on a round it captured,
        # and a per-event request that failed inside that round is named in
        # a ::warning:: (the games that answered are kept). It exits 2 when
        # nothing was captured because the events list or the per-event
        # requests failed, which makes this step red. That is the report, not
        # the damage: every step below is `if: always()`, so the uploads and
        # the closing-price hand-off still run.
        # tests/test_a_failed_price_request_is_not_an_unquoted_game.py holds
        # both rules.
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/capture_line_movement.py --live \
            --credit-cap "${{ inputs.credit_cap || '600' }}"

      - name: Capture deployment
        id: deployment
        # Taken in the SAME run as the prices, so the two share an instant and
        # can be joined. That is the whole design: the question worth asking
        # is not "who was scratched" but "was the scratch public before the
        # market moved", and only a shared timestamp can answer it.
        #
        # Free and inside the NHL API licence the lab already relies on. It
        # spends no provider credits, so it runs even when the price capture
        # is capped or fails. The id is what the last step reads: without one,
        # this step's outcome could not be read by anything.
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/capture_deployment.py

      - name: Capture line combinations
        id: lines
        # The other half of the deployment signal. `capture_deployment.py`
        # records who is OUT; this records who moved UP -- promoted to the
        # first line or onto the top power-play unit, which is exactly the
        # "usage about to rise" event that costs the model -6.44% over 5,661
        # bets. Same run as the prices, so the two share an instant.
        #
        # Free, no provider credits, so it runs even when the price capture
        # is capped or fails. It CANNOT be collected retroactively: the
        # source publishes only its current lines and keeps no archive, so a
        # night not captured is gone.
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          # A source that blocks cloud IPs would look exactly like a quiet
          # night, and the first game day is the worst time to find out. The
          # rehearsal flag exists so the fetch path can be proven from a
          # runner before the season, not assumed.
          if [ "${{ inputs.rehearse_lines }}" = "true" ]; then
            python scripts/capture_line_combinations.py --ignore-schedule
          else
            python scripts/capture_line_combinations.py
          fi

      - name: Scan the captured ladders
        # The 2026-10-15 checkpoint in docs/pre_registered_ladder_coherence.md
        # reads rung DEPTH, and this puts that number in every run summary
        # rather than on one date. The reason is the failure it detects.
        #
        # A 422 from the provider drops all ten alternate keys and falls back
        # to the nine core markets. That fallback is correct -- losing the
        # ladders is a bounded loss where losing every prop on every event is
        # not -- and it warns. But the job stays green, and nothing else
        # asserts a rung ever arrived. If it fires on opening night it fires
        # for every event of every run, the season's ladder collection is
        # zero, and every workflow above is still green. That is this repo's
        # recorded "a green step can be one that never ran".
        #
        # Free: it reads files this job already wrote and spends no credit.
        #
        # ITS EXIT IS KEPT. The scanner exits 2 when a captured day file could
        # not be read, having written a report that names it. Until
        # 2026-09-26 this line ended `|| true`, and the scanner skipped a
        # damaged day without a word: the depth the 2026-10-15 checkpoint
        # reads came out short with this step green, and an undecodable byte
        # (which raised) became "Ladder scan wrote no report" on every run.
        # The exit is held until the summary below is written, then returned.
        # The step stays continue-on-error so a failed scan can never stop
        # the captures being kept; the last step reads its outcome and turns
        # the run red after every upload.
        #
        # RED ONLY FOR THE DAY THIS RUN WROTE. The artifact carries every day
        # and each run restores the newest copy, so a day damaged in October
        # is still damaged in March. `--fail-on-day` names the league day the
        # capture appended to (computed as `capture_line_movement.py` and the
        # restore step compute it); damage there exits 2, and an earlier
        # damaged day is named in the summary every run as a warning and
        # exits 0. Otherwise one bad day would red every later run of the
        # season and bury the line-unit and scratch-list gates, which report
        # data that cannot be collected later.
        # tests/test_the_ladder_scan_names_a_damaged_day.py holds these rules.
        id: ladder
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          SCAN_EXIT=0
          DAY=$(TZ=America/New_York date +%F)
          python scripts/run_ladder_coherence.py --fail-on-day "$DAY" || SCAN_EXIT=$?
          if [ -f data/outputs/ladder_coherence.json ]; then
            DEPTH=$(python -c "import json;print(json.load(open('data/outputs/ladder_coherence.json')).get('ladders_with_two_rungs',0))")
            LADDERS=$(python -c "import json;print(json.load(open('data/outputs/ladder_coherence.json')).get('ladders',0))")
            echo "### Ladder depth: $DEPTH" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ladders with two or more de-viggable rungs, out of $LADDERS scanned." >> "$GITHUB_STEP_SUMMARY"
            echo "Two seasons of bought history produced 57. The 2026-10-15 checkpoint wants 2,000." >> "$GITHUB_STEP_SUMMARY"
            if [ "$DEPTH" = "0" ] && [ "$LADDERS" != "0" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **Depth is zero while $LADDERS ladders were scanned.** Read this as the alternate keys not arriving -- check this run's capture warnings for a 422 -- and NOT as books being coherent. The two are indistinguishable here." >> "$GITHUB_STEP_SUMMARY"
            fi
            UNREADABLE=$(python -c "import json;print('\n'.join('- \`%s\` (%s) -- %s' % (e['name'], e['reason'], 'this run\'s day: the run is red' if e.get('fails_run') else 'an earlier day: a standing warning') for e in json.load(open('data/outputs/ladder_coherence.json')).get('unreadable_captures',[])))")
            if [ -n "$UNREADABLE" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> **These captured day files could not be read, and their ladders are not in the depth above:**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "$UNREADABLE" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### Ladder scan wrote no report" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$SCAN_EXIT"

      - name: Fold in this run's earlier attempts
        # A RE-RUN MUST NOT DELETE THE ROUND IT WAS RUN TO RESCUE. The gates
        # at the end say a lost night "cannot be collected later", which
        # invites a Re-run. An artifact belongs to the run, not the attempt,
        # so the upload below (`overwrite: true`) deleted attempt 1's
        # `line-movement`, the only copy of its prices, scratch list and line
        # units; and "Restore today's captures" could not have brought that
        # round back, because GitHub lists this run as in progress while it
        # re-runs and only completed runs are restore sources. So on every
        # attempt after the first, this run's own artifact is unioned row by
        # row into data/processed (the restore's own `union_csv`) before it
        # is uploaded again. A run whose earlier attempt uploaded nothing
        # recovers nothing. Free: GitHub's API only, no provider credit.
        # A download that fails otherwise makes this step's outcome a
        # failure: the upload below then does not run, this attempt's
        # captures are kept beside the earlier ones under their own name,
        # and the gate at the end makes the run red.
        # tests/test_a_rerun_keeps_the_first_attempts_captures.py runs it.
        id: earlier
        if: always() && github.run_attempt != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/restore_state.py --fold-run "$GITHUB_RUN_ID" \
            --artifact line-movement --dest data/processed --attempts 3

      - name: Keep the captures
        # ONE ROOT. upload-artifact roots an artifact at the common ancestor
        # of its paths, and "Restore today's captures" unpacks it into
        # data/processed, so every path here must sit under data/processed.
        # Two data/outputs files were added to this list on 2026-09-22, which
        # moved the root to data/: every restored capture would have landed
        # one directory too deep, each run would have started the day's file
        # afresh, and continue-on-error would have kept the job green. The
        # history then lives only in per-run artifacts that expire in 90 days.
        # tests/test_the_capture_chain_restores_where_it_uploads.py derives
        # this from the file rather than trusting this comment.
        #
        # Not after a failed fold (above): overwriting an earlier attempt's
        # artifact that could not be read would delete its captures.
        if: always() && steps.earlier.outcome != 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: line-movement
          path: |
            data/processed/line_movement
            data/processed/deployment
            data/processed/line_combinations
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      - name: Keep this attempt's captures beside the earlier ones
        # Only when this run's earlier artifact could not be read. Nothing
        # restores this name, so the round lives here until someone unions
        # it by hand; that is the red gate's report, not a silent loss of
        # either attempt.
        if: always() && steps.earlier.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: line-movement-attempt-${{ github.run_attempt }}
          path: |
            data/processed/line_movement
            data/processed/deployment
            data/processed/line_combinations
          if-no-files-found: warn
          retention-days: 90

      - name: Keep the ladder scan
        # Its own artifact, for the reason above: it lives under data/outputs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-coherence
          path: |
            data/outputs/ladder_coherence.json
            data/outputs/ladder_coherence.md
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      - name: Hand the closing prices to Closing Lines
        # The capture above also wrote this run's best price per selection to
        # data/processed/closing_line_captures.csv, and until 2026-09-24
        # nothing kept it: this job cannot write to a branch, and the
        # closing-lines branch Gameday Refresh reads CLV from had no writer
        # once Closing Lines lost its schedule on 2026-08-29. Closing Lines
        # now runs when this workflow completes, takes this artifact, and
        # merges it into that branch. This run's rows only; the branch is the
        # store. A night with no games writes no file and hands over nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closing-line-captures
          path: data/processed/closing_line_captures.csv
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Say what this run did not do
        if: always()
        run: |
          echo "This job captured prices for later analysis."
          echo "It wrote no staging file, froze no opinion, edited no policy,"
          echo "allowlisted no provider, and placed no bet."

      - name: Fail the run when an earlier attempt could not be folded in
        # After every upload: this attempt's captures are kept under
        # line-movement-attempt-N, the earlier attempt's under line-movement,
        # and neither is in the next run's restore until the two are unioned.
        if: always() && steps.earlier.outcome == 'failure'
        run: |
          echo "::error::This run's line-movement artifact from an earlier attempt could not be downloaded or merged (see Fold in this run's earlier attempts), so it was not overwritten. This attempt's captures are in line-movement-attempt-${{ github.run_attempt }}; the next run restores only line-movement, so union the two (scripts/restore_state.py union_csv) or this attempt's round is missing from the chain."
          exit 1

      - name: Fail the run when the previous captures were not restored
        # After every upload: this run's round is kept either way, and the
        # red X is the report, not the damage. It names what the restore
        # could not ask GitHub (restore_problem.txt, written by "Restore
        # today's captures"), because a run that started its day files
        # afresh uploaded a carrier holding its own round alone, and three
        # of those in a row leave every earlier capture outside the union's
        # window. Seen after one, the chain can be repaired by hand before
        # the third: gh run download <run-id> -n line-movement from the last
        # run that restored normally, and union it (scripts/restore_state.py
        # union_csv). tests/test_a_line_movement_restore_that_could_not_ask_is_red.py
        # runs it. A restore cut off by its timeout (or failing outright)
        # left no sentence in the file, so its outcome is read as well.
        if: always()
        run: |
          if [ "${{ steps.restore.outcome }}" = "failure" ]; then
            echo "::error::Restore today's captures did not finish (it failed or hit its 5-minute limit), so this run may have started its day files afresh and uploaded a carrier missing earlier rounds. Three such runs in a row drop every earlier capture from the chain."
            exit 1
          fi
          if [ -s restore_problem.txt ]; then
            echo "::error::The previous captures were not fully restored this run, so it uploaded a carrier missing earlier rounds. Three such runs in a row drop every earlier capture from the chain. What could not be reached: $(tr '\n' ' ' < restore_problem.txt)"
            exit 1
          fi
          echo "The previous captures were restored."

      - name: Fail the run when the line units were not captured
        # The capture above stays continue-on-error so a line-source failure
        # can never cost the prices, but that also made a lost night look like
        # a green run. The source keeps no archive, so a game day whose line
        # units were not captured is gone for good. This runs after every
        # upload above, so the captures are already kept: the red X is the
        # report, not the damage. The capture script exits 0 on a night with
        # no games or when at least half the team pages were read (a partial
        # capture names every team it lost in a ::warning::), and 2 when
        # nothing was captured or fewer than half the teams were.
        if: always() && steps.lines.outcome == 'failure'
        run: |
          echo "::error::The Daily Faceoff line units were NOT captured this run, or fewer than half the teams were (see Capture line combinations; the price capture reports on itself). That source keeps no archive, so this night's line units cannot be collected later."
          exit 1

      - name: Fail the run when the scratch list was not captured
        # The same report for the NHL scratch list, which the gate above left
        # out. "Capture deployment" is continue-on-error so it can never cost
        # the prices, and until 2026-09-25 it had no id, so nothing read its
        # outcome; the script also exited 0 when every right-rail fetch failed.
        # In the failure-shape audit's replay two games with every fetch
        # refused (HTTP 403, 503 past the retries, or unreachable) ran green
        # and wrote no file. Who was scratched can be rebuilt from box scores;
        # when the list became public cannot, and that instant is the capture.
        # The script exits 0 on a night with no games or when at least one
        # game was captured (a partial capture warns and names the games it
        # lost), and 2 when the schedule could not be read or no game was.
        # Runs after every upload, so the red X reports the loss without
        # causing any.
        if: always() && steps.deployment.outcome == 'failure'
        run: |
          echo "::error::The NHL scratch list was NOT captured this run: no game's list was read, or the schedule could not be (see Capture deployment). The API keeps no archive of when a scratch list became public, so this run's instant cannot be collected later."
          exit 1

      - name: Fail the run when the ladder scan failed
        # "Scan the captured ladders" stays continue-on-error so a failed scan
        # can never cost the captures, which made a damaged day a green run.
        # The scanner exits 2 when the day file THIS run appended to could
        # not be read (`--fail-on-day`), and that day's ladders are then
        # missing from the depth the 2026-10-15 checkpoint reads. An earlier
        # damaged day is a standing warning in the scan's summary, never a
        # red here: it would otherwise red every run for the rest of the
        # season. So a run is red for a damaged day only while that league
        # day is the one being captured. This runs after every upload, so the
        # captures and the report naming the file are already kept: the red
        # X is the report, not the damage.
        if: always() && steps.ladder.outcome == 'failure'
        run: |
          echo "::error::The ladder scan failed, or could not read the day file this run appended to (see Scan the captured ladders, which names it). That day's ladders are left out of the depth in this run's summary. Earlier runs' line-movement artifacts keep earlier copies of the file (gh run download <run-id> -n line-movement); no step in this workflow repairs it in the chain."
          exit 1
