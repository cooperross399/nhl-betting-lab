name: Backtest Rerun

# Rebuild the saved backtest reports on the current code, against the bought
# prices, and say which verdicts the game-counted intervals (#455) move
# (Cooper, 2026-11-10: "ALL"). Props backtest in both windows (`late` and
# `card`), the two seasons of the `late` window and their replication, the
# team markets measurement and the claims document.
#
# It fetches no odds, spends no credit, places no bet, pushes nothing and
# edits no policy or receipt. The bought prices are restored onto the runner
# from Historical Props Purchase's artifacts (they expire from CI on
# 2026-11-29) and deleted before the job ends. The `backtest-rerun` artifact
# holds only the aggregate reports this run wrote (markdown and JSON: counts,
# returns and intervals), never a price file or the bets CSV. Nothing is
# committed: the committed reports are pinned by the receipts' checksums and
# re-attesting them is Cooper's call.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backtest-rerun.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: backtest-rerun
  cancel-in-progress: false

jobs:
  rerun:
    name: Backtest Rerun
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores, the samples and the bought prices
        # As Experiment Refresh and Hits Model Study restore them. Bought
        # prices cannot be regenerated, so their absence stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          for file in historical_prop_prices.csv historical_team_prices.csv; do
            if [ ! -s "data/processed/$file" ]; then
              echo "::error::data/processed/$file did not restore (the bought prices expire from CI on 2026-11-29), so there is nothing to measure against."
              exit 1
            fi
            echo "$file: $(wc -l < "data/processed/$file") lines"
          done
          PYTHONPATH=src python scripts/build_datasets.py || true
          # Checked, not trusted: kept only when they record the verdict in
          # this checkout and priced every game in the logs, rebuilt otherwise.
          PYTHONPATH=src python scripts/run_props_calibration.py --reuse-samples
          echo "samples: $(wc -l < data/outputs/prop_calibration_samples.csv) lines"

      - name: Rebuild the reports
        # THE ORDER IS LOAD-BEARING: every props run also writes the contract
        # player_props_backtest.md/.json, so the season windows go first and
        # `late` goes last, as Historical Props Purchase orders them, and the
        # claims document reads what the last runs wrote.
        id: rebuild
        env:
          PYTHONPATH: src
        run: |
          set -eu
          mkdir -p data/outputs/rerun
          python scripts/run_player_props_backtest.py --phase late \
            --from 2024-07-01 --to 2025-06-30 --label 2024-25 \
            --interval-comparison data/outputs/rerun/intervals_late_2024-25.json
          python scripts/run_player_props_backtest.py --phase late \
            --from 2025-07-01 --to 2026-06-30 --label 2025-26 \
            --interval-comparison data/outputs/rerun/intervals_late_2025-26.json
          python scripts/run_replication.py \
            --discovery data/outputs/player_props_backtest_2024-25.json \
            --test data/outputs/player_props_backtest_2025-26.json
          python scripts/run_player_props_backtest.py --phase card --label card \
            --interval-comparison data/outputs/rerun/intervals_card.json
          python scripts/run_player_props_backtest.py --phase late \
            --interval-comparison data/outputs/rerun/intervals_late.json
          python scripts/run_team_markets_measurement.py --phase late
          python scripts/run_what_we_can_claim.py

      - name: Write the result to the run summary
        if: ${{ always() && steps.rebuild.outcome == 'success' }}
        run: |
          {
            for report in player_props_backtest.md player_props_backtest_card.md \
                          team_markets_measurement.md replication.md what_we_can_claim.md; do
              echo "## $report"
              echo
              cat "data/outputs/$report"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for file in data/outputs/rerun/*.json; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done

      - name: Remove the bought prices from the workspace
        if: always()
        run: |
          rm -f data/processed/historical_prop_prices.csv \
                data/processed/historical_team_prices.csv \
                data/outputs/player_props_backtest_bets.csv
          rm -rf data/raw/historical_props data/raw/historical_team_prices

      - name: Keep the aggregate reports
        # Named files only: counts, returns and intervals. No price file,
        # no bets CSV, no glob.
        if: ${{ always() && steps.rebuild.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-rerun
          path: |
            data/outputs/player_props_backtest.md
            data/outputs/player_props_backtest.json
            data/outputs/player_props_backtest_card.md
            data/outputs/player_props_backtest_card.json
            data/outputs/player_props_backtest_2024-25.md
            data/outputs/player_props_backtest_2024-25.json
            data/outputs/player_props_backtest_2025-26.md
            data/outputs/player_props_backtest_2025-26.json
            data/outputs/replication.md
            data/outputs/replication.json
            data/outputs/team_markets_measurement.md
            data/outputs/team_markets_measurement.json
            data/outputs/what_we_can_claim.md
            data/outputs/rerun/intervals_late.json
            data/outputs/rerun/intervals_card.json
            data/outputs/rerun/intervals_late_2024-25.json
            data/outputs/rerun/intervals_late_2025-26.json
          if-no-files-found: warn
          retention-days: 30
