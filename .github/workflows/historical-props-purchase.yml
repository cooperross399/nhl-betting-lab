name: Historical Props Purchase

# Buys historical prop prices so the model can be measured against prices that
# were actually for sale.
#
# THIS SPENDS CREDITS, and it is the most expensive thing in the repository:
# somewhere between one and ten credits per market per event. The provider
# documents ten for its bulk historical endpoint and is ambiguous about the
# per-event one, so the true rate is read from `x-requests-last` as it is
# spent and the cap is enforced against the pessimistic reading.
#
# It is manual-dispatch only and will never be put on a schedule. The credit
# cap is a required input and is enforced before each request rather than
# checked afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe retention, buy props, or buy team markets"
        type: choice
        required: true
        options: [probe, buy, buy_team]
        default: probe
      credit_cap:
        description: "Hard cap on credits for this run. Required."
        type: string
        required: true
        default: "60"
      start_date:
        description: "ISO start date of the window to sample"
        type: string
        required: true
        default: "2025-10-08"
      end_date:
        description: "ISO end date of the window to sample"
        type: string
        required: true
        default: "2026-04-15"
      every_n_days:
        description: "Sample every Nth day, so the window is spread not clumped"
        type: string
        required: false
        default: "7"
      markets:
        description: "Provider market keys to buy, space separated. Blank buys all."
        type: string
        required: false
        default: ""
      hours_before:
        description: "Hours before puck drop to price at"
        type: string
        required: false
        default: "4"
      seasons:
        description: "Season ids to fit the model on, space separated"
        type: string
        required: false
        default: "20232024 20242025 20252026"

permissions:
  contents: read
  # Read-only, and only so a run can restore the previous run's artifacts.
  actions: read

concurrency:
  # Two purchases racing would each restore the other's stale price file and
  # the second upload would win, silently discarding the first run's spend.
  # Serialised, never cancelled: a purchase that has already spent credits
  # must be allowed to finish and upload what it bought.
  group: historical-purchase
  cancel-in-progress: false

jobs:
  purchase:
    name: Historical props purchase
    runs-on: ubuntu-latest
    # Generous, because this job rebuilds the walk-forward samples from the
    # NHL API before it measures anything. A first run pays for the whole
    # boxscore cache; every later run restores it and is quick.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the cached boxscores and samples
        # Without this, every run refetches four thousand boxscores. They
        # never change once a game is final, so this is the difference
        # between a two-minute job and an hour-long one.
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          previous=$(gh run list --workflow historical-props-purchase.yml \
            --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$previous" ]; then
            previous=$(gh run list --workflow gameday-refresh.yml \
              --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')
          fi
          if [ -z "$previous" ]; then
            echo "No previous state. This run rebuilds it from scratch."
            exit 0
          fi
          mkdir -p data
          # `--name` matters. Without it `gh` puts each artifact in a
          # subdirectory named after itself, so the cache lands in
          # `data/gameday-state/raw/...` where nothing looks for it — and the
          # step still reports success, so the run silently refetches four
          # thousand boxscores it already had.
          gh run download "$previous" --name gameday-state --dir data || \
            echo "No usable state on run $previous; rebuilding."
          restored=$(find data/raw/nhl/boxscore -name '*.json' 2>/dev/null | wc -l)
          echo "Cached boxscores restored: $restored"
          if [ "$restored" -eq 0 ]; then
            echo "::warning::No boxscores were restored; this run rebuilds the cache from scratch."
          fi

      - name: Rebuild the price files from the raw cache
        # The CSVs are derived data: every bought response is cached raw and
        # never changes, so the CSVs are reconstructed from them on every run.
        # This is what makes a clobbered or missing CSV in an artifact heal
        # itself instead of silently shrinking the measurement — a purchase
        # that bought nothing once overwrote eleven thousand credits of
        # accumulated prices with an empty file, and the raw cache turned that
        # into a five-minute recovery.
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/rebuild_price_files.py

      - name: Check the provider credential
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py

      - name: Report the quota before spending any of it
        # The /v4/sports listing is documented as free, so this is the
        # cheapest possible way to find out whether the run can afford itself.
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_quota.py \
            --fail-under "${{ inputs.credit_cap }}"

      - name: State the cost before spending it
        run: |
          echo "Mode: ${{ inputs.mode }}"
          echo "Hard credit cap: ${{ inputs.credit_cap }}"
          echo "Window: ${{ inputs.start_date }} .. ${{ inputs.end_date }}"
          echo "Sampling every ${{ inputs.every_n_days }} day(s)."
          echo "Historical per-event cost is documented ambiguously: between"
          echo "1 and 10 credits per market. The cap is enforced against 10,"
          echo "and real spend is read from x-requests-last as it happens."

      - name: Rebuild the results and the walk-forward samples
        # Buying team markets needs the team samples, which come from the same
        # rebuild.
        # A purchase with nothing to measure it against is wasted credits, so
        # a buy rebuilds the samples first. The NHL API is free and keyless
        # and a final boxscore is never refetched, so this is cheap on any run
        # after the first — but the first pays for four thousand games.
        #
        # A probe skips it entirely. A probe asks one question of one event
        # ("which markets does the provider retain") and nothing in the answer
        # depends on the model, so making it wait half an hour for 1.9 million
        # walk-forward samples was pure ceremony. Probing is the thing you do
        # repeatedly while exploring retention; it should be minutes.
        if: ${{ inputs.mode != 'probe' }}
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_nhl_data.py --polite-seconds 0.25 \
            --seasons ${{ inputs.seasons }}
          python scripts/build_datasets.py
          if [ ! -s data/outputs/prop_calibration_samples.csv ]; then
            python scripts/run_props_calibration.py
          else
            echo "Reusing the restored walk-forward samples."
            python scripts/run_props_calibration.py --reuse-samples
          fi

      - name: Probe retention
        # One event, so the cost is bounded and known, and the answer turns
        # "which markets can be measured historically" from an assumption into
        # a measured fact.
        if: ${{ inputs.mode == 'probe' }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/buy_historical_props.py --probe --live \
            --from "${{ inputs.start_date }}" --to "${{ inputs.start_date }}" \
            --credit-cap "${{ inputs.credit_cap }}" \
            --hours-before "${{ inputs.hours_before }}"

      - name: Buy a window
        if: ${{ inputs.mode == 'buy' }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          MARKETS=""
          if [ -n "${{ inputs.markets }}" ]; then
            MARKETS="--markets ${{ inputs.markets }}"
          fi
          python scripts/buy_historical_props.py --live \
            --from "${{ inputs.start_date }}" --to "${{ inputs.end_date }}" \
            --every-n-days "${{ inputs.every_n_days }}" \
            --credit-cap "${{ inputs.credit_cap }}" \
            --hours-before "${{ inputs.hours_before }}" $MARKETS

      - name: Buy team markets
        # The bulk historical endpoint returns every game on the board at one
        # instant for 10 x markets x regions, so a whole slate costs thirty
        # credits whether it holds four games or fourteen. That is why these
        # went unmeasured while the props were bought twice.
        if: ${{ inputs.mode == 'buy_team' }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/buy_historical_team_prices.py --live \
            --from "${{ inputs.start_date }}" --to "${{ inputs.end_date }}" \
            --every-n-days "${{ inputs.every_n_days }}" \
            --credit-cap "${{ inputs.credit_cap }}"

      - name: Rebuild the team measurement
        if: ${{ inputs.mode == 'buy_team' }}
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_team_markets_measurement.py

      - name: Rebuild the backtest with whatever was bought
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_player_props_backtest.py
          python scripts/run_what_we_can_claim.py

      - name: Write the result to the run summary
        if: always()
        run: |
          {
            echo "## What can be measured"
            echo
            cat data/outputs/player_props_backtest.md 2>/dev/null \
              || echo "No backtest report was produced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload what was bought
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-props
          path: |
            data/raw/historical_props
            data/processed/historical_prop_prices.csv
            data/processed/historical_team_prices.csv
            data/outputs/team_markets_measurement.md
            data/outputs/historical_props_retention.json
            data/outputs/player_props_backtest.md
            data/outputs/player_props_backtest_bets.csv
            data/outputs/what_we_can_claim.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the state for the next run
        # The boxscore cache and the walk-forward samples are what make a
        # second run cheap. The bought prices go with them because they are
        # evidence: historical prices never change, so re-buying one is a
        # credit spent on something already owned.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameday-state
          path: |
            data/raw/nhl/boxscore
            data/raw/nhl/registry
            data/raw/nhl/club_schedule
            data/raw/historical_props
            data/raw/historical_team_prices
            data/processed
            data/outputs/prop_calibration_samples.csv
            data/outputs/team_market_samples.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Confirm the boundary
        if: always()
        run: |
          echo "This job bought prices and rebuilt the measurement reports."
          echo "It placed no bet, edited no policy, wrote no receipt, and"
          echo "allowlisted no market."
