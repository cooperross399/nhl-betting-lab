name: Historical Props Purchase

# Buys historical prop prices so the model can be measured against prices that
# were actually for sale.
#
# THIS SPENDS CREDITS, and it is the most expensive thing in the repository:
# somewhere between one and ten credits per market per event, per region —
# and the lab asks two regions (us,us2). The provider documents ten for its
# bulk historical endpoint and is ambiguous about the per-event one, so the
# true rate is read from `x-requests-last` as it is spent and the cap is
# enforced against the pessimistic reading. (Measured: ten per market
# returned at one region on 2026-08-25, and 107 an event — 10 x ~5.35
# returned x 2 — on the two-region purchase that spent 289,984.)
#
# It is manual-dispatch only and will never be put on a schedule. The credit
# cap is a required input and is enforced before each request rather than
# checked afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe retention, buy props, or buy team markets"
        type: choice
        required: true
        options: [probe, buy, buy_team]
        default: probe
      credit_cap:
        description: "Hard cap on credits for this run. Required."
        type: string
        required: true
        default: "60"
      start_date:
        description: "ISO start date of the window to sample"
        type: string
        required: true
        default: "2025-10-08"
      end_date:
        description: "ISO end date of the window to sample"
        type: string
        required: true
        default: "2026-04-15"
      every_n_days:
        description: "Sample every Nth day, so the window is spread not clumped"
        type: string
        required: false
        default: "7"
      markets:
        description: "Provider market keys to buy, space separated. Blank buys all."
        type: string
        required: false
        default: ""
      hours_before:
        description: "Hours before puck drop to price at"
        type: string
        required: false
        default: "4"
      seasons:
        description: "Season ids to fit the model on, space separated"
        type: string
        required: false
        default: "20232024 20242025 20252026"

permissions:
  contents: read
  # Read-only, and only so a run can restore the previous run's artifacts.
  actions: read

concurrency:
  # Two purchases racing would each restore the other's stale price file and
  # the second upload would win, silently discarding the first run's spend.
  # Serialised, never cancelled: a purchase that has already spent credits
  # must be allowed to finish and upload what it bought.
  group: historical-purchase
  cancel-in-progress: false

jobs:
  purchase:
    name: Historical props purchase
    runs-on: ubuntu-latest
    # Generous, because this job rebuilds the walk-forward samples from the
    # NHL API before it measures anything. A first run pays for the whole
    # boxscore cache; every later run restores it and is quick.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the cached boxscores and samples
        # Without this, every run refetches four thousand boxscores. They
        # never change once a game is final, so this is the difference
        # between a two-minute job and an hour-long one.
        #
        # NOT continue-on-error, and it must not become so. Both artifacts
        # below carry prices that were paid for, and a restore that could not
        # ASK GitHub used to read exactly like one that was told there is
        # nothing. The historical-props listing was inline and read no
        # status. The gameday-state restore read a failed listing as "no
        # runs", and a failed download as "try an older run". So one HTTP 502
        # printed "No purchase run on main carries bought prices" and exited
        # 0 under the `bash -e` GitHub runs a step with no `shell:` under.
        # The buy then found no cached event and paid for the window again.
        # In the failure-shape audit's replay that was 12 events and 1,284
        # credits, where a working restore served all 12 from the cache for
        # 0. The price file it wrote held that run's 7,961 rows alone, and
        # both uploads below carried them, where the carrier before held
        # 40,942. The next purchase took the thin run as the chain, and so
        # did Experiment Refresh. A full window has cost 157,870 to 289,984
        # credits.
        #
        # Now, under --refuse-unreachable, a listing that fails, or a
        # download that fails for any reason but gh saying the run holds
        # none, is tried three times. If it still fails, the step fails and
        # the job stops here: before the credential check, before any paid
        # request, and with both uploads gated on this step. Only a listing
        # that answers with no carrier starts without them. A run that holds
        # none, such as a refused or expired one, is passed over, which is
        # why this is not --require-newest: a refused run uploads nothing,
        # and under that flag no later purchase could get past it.
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p data
          # From the newest run that carries the state, whatever its
          # conclusion — a purchase that died writing its CSV still uploaded
          # it — with the newest successful state laid underneath. `--name`
          # matters, and restore_state.py always passes it: without it `gh`
          # puts each artifact in a subdirectory named after itself, so the
          # cache lands in `data/gameday-state/raw/...` where nothing looks.
          # The purchase's own state is the only copy of the raw team
          # responses, so it is held to the same contract as the prices.
          python scripts/restore_state.py --artifact gameday-state --dest data \
            --workflow historical-props-purchase.yml --workflow gameday-refresh.yml \
            --refuse-unreachable --attempts 3 || {
            echo "::error::The previous state could not be restored because GitHub could not be asked (gh's own words are above). It carries the bought prices and the raw team responses, so this run stops before it spends a credit or uploads anything. Dispatch it again once GitHub answers."
            exit 1
          }
          # `|| true`: with nothing restored `find` fails on the missing
          # directory, and under pipefail that would end the step here.
          restored=$(find data/raw/nhl/boxscore -name '*.json' 2>/dev/null | wc -l || true)
          echo "Cached boxscores restored: $restored"

          # The bought prices themselves. This artifact was uploaded by every
          # previous purchase and restored by none of them, so each run began
          # with an empty cache and re-bought what the last one already owned.
          # A single window has cost 157,870 credits; re-buying it is not a
          # rounding error, and a cached event costs nothing.
          #
          # Taken from the most recent run ON MAIN that produced one,
          # successful or not (`--no-merge`: that run alone, as always): the
          # run that spends the credits and the run that finishes green are
          # not always the same run — the purchase that prompted this fix
          # bought 2,710 events and then died writing the CSV.
          #
          # On main only, as restore_state.py reads every listing: by gh's
          # `--branch` AND by each run's own headBranch. The inline listing
          # this replaces once had neither. The purchase is dispatch-only, so
          # it runs on any branch, and the next main purchase took the newest
          # carrier on ANY branch: evidence written by code nobody reviewed,
          # which both uploads below then carried forward under a main run's
          # id. Replayed with one branch dispatch that had bought two
          # responses for one event, 1,430 of the 9,391 rebuilt rows came
          # from it (#185). That listing then read no status either, which is
          # the failure described above the step; restore_state.py is the one
          # place both are handled. `--limit 20` is that listing's window.
          # Into a scratch folder, as before: only the raw responses and the
          # price files are taken from it, not the reports beside them.
          python scripts/restore_state.py --artifact historical-props --dest /tmp/probe \
            --workflow historical-props-purchase.yml --limit 20 --no-merge \
            --refuse-unreachable --attempts 3 --record-run /tmp/probe.run || {
            echo "::error::GitHub could not be asked which purchase run on main carries the bought prices (gh's own words are above), so this run stops before it spends a credit or uploads anything. Starting without them would buy again what the lab already owns, and this run's uploads, holding only that, would become the chain's newest carrier. Dispatch it again once GitHub answers."
            exit 1
          }
          bought=$(cat /tmp/probe.run)
          if [ -n "$bought" ]; then
            mkdir -p data/raw/historical_props data/processed
            cp -R /tmp/probe/raw/historical_props/. data/raw/historical_props/ 2>/dev/null || true
            cp -R /tmp/probe/processed/. data/processed/ 2>/dev/null || true
            cached=$(find data/raw/historical_props -name '*.json' 2>/dev/null | wc -l)
            echo "Bought-price cache restored from run $bought on main: $cached response(s)."
          else
            echo "No purchase run on main carries bought prices. Anything bought this run is bought fresh."
          fi
          if [ "$restored" -eq 0 ]; then
            echo "::warning::No boxscores were restored; this run rebuilds the cache from scratch."
          fi

      - name: Rebuild the price files from the raw cache
        # The CSVs are derived data: every bought response is cached raw and
        # never changes, so the CSVs are reconstructed from them on every run.
        # This is what makes a clobbered or missing CSV in an artifact heal
        # itself instead of silently shrinking the measurement — a purchase
        # that bought nothing once overwrote eleven thousand credits of
        # accumulated prices with an empty file, and the raw cache turned that
        # into a five-minute recovery.
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/rebuild_price_files.py

      - name: Check the provider credential
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py

      - name: Report the quota before spending any of it
        # The /v4/sports listing is documented as free, so this is the
        # cheapest possible way to find out whether the run can afford itself.
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_quota.py \
            --fail-under "${{ inputs.credit_cap }}"

      - name: State the cost before spending it
        run: |
          echo "Mode: ${{ inputs.mode }}"
          echo "Hard credit cap: ${{ inputs.credit_cap }}"
          echo "Window: ${{ inputs.start_date }} .. ${{ inputs.end_date }}"
          echo "Sampling every ${{ inputs.every_n_days }} day(s)."
          echo "Historical per-event cost is documented ambiguously: between"
          echo "1 and 10 credits per market. The cap is enforced against 10,"
          echo "and real spend is read from x-requests-last as it happens."

      - name: Rebuild the results and the walk-forward samples
        # Buying team markets needs the team samples, which come from the same
        # rebuild.
        # A purchase with nothing to measure it against is wasted credits, so
        # a buy rebuilds the samples first. The NHL API is free and keyless
        # and a final boxscore is never refetched, so this is cheap on any run
        # after the first — but the first pays for four thousand games.
        #
        # A probe skips it entirely. A probe asks one question of one event
        # ("which markets does the provider retain") and nothing in the answer
        # depends on the model, so making it wait half an hour for 1.9 million
        # walk-forward samples was pure ceremony. Probing is the thing you do
        # repeatedly while exploring retention; it should be minutes.
        if: ${{ inputs.mode != 'probe' }}
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_nhl_data.py --polite-seconds 0.25 \
            --seasons ${{ inputs.seasons }}
          python scripts/build_datasets.py
          if [ ! -s data/outputs/prop_calibration_samples.csv ]; then
            python scripts/run_props_calibration.py
          else
            echo "Reusing the restored walk-forward samples."
            python scripts/run_props_calibration.py --reuse-samples
          fi

      - name: Probe retention
        # One event, so the cost is bounded and known, and the answer turns
        # "which markets can be measured historically" from an assumption into
        # a measured fact.
        if: ${{ inputs.mode == 'probe' }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/buy_historical_props.py --probe --live \
            --from "${{ inputs.start_date }}" --to "${{ inputs.start_date }}" \
            --credit-cap "${{ inputs.credit_cap }}" \
            --hours-before "${{ inputs.hours_before }}"

      - name: Buy a window
        if: ${{ inputs.mode == 'buy' }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          MARKETS=""
          if [ -n "${{ inputs.markets }}" ]; then
            MARKETS="--markets ${{ inputs.markets }}"
          fi
          python scripts/buy_historical_props.py --live \
            --from "${{ inputs.start_date }}" --to "${{ inputs.end_date }}" \
            --every-n-days "${{ inputs.every_n_days }}" \
            --credit-cap "${{ inputs.credit_cap }}" \
            --hours-before "${{ inputs.hours_before }}" $MARKETS

      - name: Buy team markets
        # The bulk historical endpoint returns every game on the board at one
        # instant for 10 x markets x regions, so at the lab's two regions
        # (us,us2) a whole slate costs 60 credits whether it holds four games
        # or fourteen. That is why these went unmeasured while the props were
        # bought twice. (This said thirty until 2026-09-25: one region.)
        if: ${{ inputs.mode == 'buy_team' }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/buy_historical_team_prices.py --live \
            --from "${{ inputs.start_date }}" --to "${{ inputs.end_date }}" \
            --every-n-days "${{ inputs.every_n_days }}" \
            --credit-cap "${{ inputs.credit_cap }}"

      - name: Rebuild the team measurement
        if: ${{ inputs.mode == 'buy_team' }}
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_team_markets_measurement.py --phase late

      - name: Rebuild the backtest with whatever was bought
        # NAME THE WINDOW. The store holds two: 4.0 hours before face-off,
        # which every recorded number describes, and 9.5, which is when the
        # card actually runs. `--phase auto` refuses a two-window store on
        # purpose, and this step is `continue-on-error`, so leaving the flag
        # off would have failed quietly and left the previous report standing
        # as though it were current. `card` is written beside the contract
        # report so the two windows stay comparable. THE ORDER IS
        # LOAD-BEARING: every run also writes `player_props_backtest.md`, so
        # `late` goes last and keeps the filename that
        # `run_what_we_can_claim.py` and the operating docs read.
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_player_props_backtest.py --phase card --label card
          python scripts/run_player_props_backtest.py --phase late
          python scripts/run_what_we_can_claim.py

      - name: Write the result to the run summary
        if: always()
        run: |
          {
            echo "## What can be measured"
            echo
            cat data/outputs/player_props_backtest.md 2>/dev/null \
              || echo "No backtest report was produced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload what was bought
        # Always, so a purchase that spent its credits and then failed still
        # keeps what it bought, but only after a restore that succeeded. The
        # checkout tracks reports under data/outputs, so a run that restored
        # nothing still uploaded an artifact of this name without one bought
        # response, and the next purchase took it as the chain.
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: historical-props
          path: |
            data/raw/historical_props
            data/processed/historical_prop_prices.csv
            data/processed/historical_team_prices.csv
            data/outputs/team_markets_measurement.md
            data/outputs/historical_props_retention.json
            data/outputs/player_props_backtest.md
            data/outputs/player_props_backtest_bets.csv
            data/outputs/what_we_can_claim.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the state for the next run
        # The boxscore cache and the walk-forward samples are what make a
        # second run cheap. The bought prices go with them because they are
        # evidence: historical prices never change, so re-buying one is a
        # credit spent on something already owned. Gated on the restore for
        # the same reason as the upload above: from a run that could not
        # restore, it held only the checkout's tracked data/processed files.
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: gameday-state
          path: |
            data/raw/nhl/boxscore
            data/raw/nhl/registry
            data/raw/nhl/club_schedule
            data/raw/historical_props
            data/raw/historical_team_prices
            data/processed
            data/outputs/prop_calibration_samples.csv
            data/outputs/team_market_samples.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Confirm the boundary
        if: always()
        run: |
          echo "This job bought prices and rebuilt the measurement reports."
          echo "It placed no bet, edited no policy, wrote no receipt, and"
          echo "allowlisted no market."
