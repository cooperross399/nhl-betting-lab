name: Props Form Test

# Does a player's recent form make better prop bets, against the prices that
# were actually for sale? (Cooper, 2026-10-09.) Prices the identical policy
# twice on the bought prop prices: the card's long-run rates, and the same
# model moved toward recent form. See scripts/run_props_form_experiment.py.
#
# It fetches no odds, spends no credit, places no bet, pushes nothing, uploads nothing,
# edits no policy and records no verdict the card reads. The bought prices
# are restored onto the runner and never leave it; the result is aggregate
# (bets, units, ROI, intervals) and goes to the run summary only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_props_form_experiment.py"
      - ".github/workflows/props-form-test.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: props-form-test
  cancel-in-progress: false

jobs:
  measure:
    name: Props Form Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores and the bought prices
        # As Experiment Refresh restores them. Bought prices cannot be
        # regenerated, so their absence stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          if [ ! -s data/processed/historical_prop_prices.csv ]; then
            echo "::error::The bought prop prices did not restore (they expire from CI on 2026-11-29), so there is nothing to price against."
            exit 1
          fi
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Price both variants
        env:
          PYTHONPATH: src
        run: |
          set -u
          status=0
          python scripts/run_props_form_experiment.py || status=$?
          if [ -s data/outputs/props_form_test.md ]; then
            cat data/outputs/props_form_test.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # The bought prices leave the workspace before the job ends.
          rm -f data/processed/historical_prop_prices.csv
          exit "$status"
