name: Publish Site

# Builds the public NHL Projections site and deploys it to GitHub Pages.
#
# Runs every morning on its own clock — including preseason and dark nights,
# when Gameday Refresh does not run — and again whenever Gameday Refresh
# finishes, so a regular-season card reaches the site within minutes.
#
# It reads the lab's outputs from the latest `gameday-state` artifact and the
# NHL's public schedule API, then hands the built folder to GitHub Pages
# through the Pages deployment API. It pushes to NO branch, holds read-only
# access to repository contents (see the permissions block below), fetches no
# odds, spends no credits, edits no policy, and places no bet.
#
# That sentence is deliberately phrased without the two-word grant it is
# disclaiming. `test_no_workflow_grants_write_access_to_contents` greps every
# workflow for the literal spelling, so a comment promising the absence of
# the thing reads to the guard exactly like the thing. A guard that greps for
# a spelling proves only that the spelling is absent — which is the whole
# point of the check, and not something to work around by relaxing it.
#
# Each day's published board is frozen into a `site-history`
# artifact so the next morning settles the opinion that was actually shown.
# That history only grows: a run that cannot restore it, or that would upload
# less than it restored, fails before anything is kept or deployed, and the
# site keeps its last build until the next run.
on:
  schedule:
    - cron: "45 14 * * *"   # 10:45 New York, after the 09:30 card
  workflow_run:
    workflows: ["Gameday Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      start_history_afresh:
        description: >-
          Start the site's history again from today. Only for when the last
          publish's site-history artifact is gone for good (expired or
          deleted): every earlier frozen board leaves the public archive.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the lab's latest state
        # Allowed to find nothing: on a bare repository, or in preseason
        # before the first card, the site is schedule-only and says so. The
        # step reports what it found.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # The state and the reports from one run: the newest Gameday
          # Refresh that carries them, whatever its conclusion. Picking "the
          # newest successful run" chose the skipped 15:00 backup — a success
          # with no artifact — and published a board with no model history.
          # Nothing is laid underneath: an older run's card must never fill
          # in for today's. See scripts/restore_state.py.
          # So after a Gameday run that started cold (its restore found
          # nothing, and its fetch caches the 600 oldest games) this takes
          # that run's thin tables alone, and they used to become the public
          # board, frozen as the day's opinion. The build below now projects
          # nothing from a history under config.THIN_HISTORY_GAMES, the line
          # Gameday calls degraded, and says so on the board (load_model in
          # the site builder).
          mkdir -p data/outputs
          python scripts/restore_state.py --artifact gameday-state --dest data \
            --workflow gameday-refresh.yml --no-merge \
            --also gameday-reports=data/outputs \
            || echo "No Gameday Refresh state could be restored; building schedule-only."

      - name: Restore the site's history
        # NOT continue-on-error, and it must not become so. This used to sit
        # in the step above as `gh run list --status success --limit 1` and
        # `gh run download ... || echo`, so a failed API call read as "No
        # previous publish; the history starts today": the build froze
        # today's board alone, index.json was rewritten with one entry, the
        # run went green and uploaded that as site-history, and the next run
        # restored from it. In the failure-shape audit's replay one HTTP 502
        # took a three-board history to one, for good, and Results said "No
        # board was published for this date" about a board published with 14
        # games. Now the history comes from the newest successful publish —
        # an older one would lose whatever the newest added — or the job
        # stops here, before anything is built, kept or deployed, and the
        # site keeps its last build until the next run. Only a listing that
        # succeeds and holds no successful publish starts the history
        # afresh, or an owner who dispatches with start_history_afresh.
        env:
          GH_TOKEN: ${{ github.token }}
          START_HISTORY_AFRESH: ${{ inputs.start_history_afresh && 'true' || 'false' }}
        run: |
          set -u
          mkdir -p dist/data/history
          if [ "$START_HISTORY_AFRESH" = "true" ]; then
            echo "::warning::Dispatched with start_history_afresh: the site's history starts again from today, and every earlier frozen board leaves the public archive."
          else
            python scripts/restore_state.py --artifact site-history --dest dist/data/history \
              --workflow publish-site.yml --success-only --require-newest --attempts 3 || {
              echo "::error::The site's history could not be restored, so nothing is built, kept or deployed; the public site keeps its last build and the next run tries again. If the newest successful publish's site-history artifact has expired or been deleted it cannot come back, and dispatching Publish Site with start_history_afresh starts the history again from today."
              exit 1
            }
          fi
          # The floor the upload is checked against, taken before the build.
          python scripts/site_history_floor.py record --history dist/data/history \
            --floor "$RUNNER_TEMP/site-history-floor.json"

      - name: Assemble the site
        run: |
          cp -R web/. dist/
          # site_history.py joins the generator already removed here: it
          # arrived with the shared pages and would otherwise be served
          # as source next to the board it froze.
          rm -f dist/*.py dist/README.md
          touch dist/.nojekyll

      - name: Build today's board and yesterday's results
        env:
          PYTHONPATH: src
        run: |
          python web/build_site_json.py --lab . --out dist/data
          python web/site_history.py --data dist/data
          printf '{"sport":"nhl"}' > dist/site.json

      - name: Refuse a history shorter than the one restored
        # Before the history is kept and before the site is deployed. Every
        # frozen board the restore brought back must still be here and
        # unchanged (it is the published opinion Results settles against),
        # every line series too, and index.json — what the Archive reads —
        # must still list every board. See scripts/site_history_floor.py.
        run: |
          python scripts/site_history_floor.py check --history dist/data/history \
            --floor "$RUNNER_TEMP/site-history-floor.json"

      - name: Keep the history for tomorrow's settlement
        uses: actions/upload-artifact@v4
        with:
          name: site-history
          path: dist/data/history
          if-no-files-found: warn
          retention-days: 400

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the outcome
        if: always()
        run: |
          echo "This job built the public site from the NHL schedule and the lab's outputs."
          echo "It fetched no odds, spent no credit, pushed no branch, edited no policy,"
          echo "and placed no bet."
