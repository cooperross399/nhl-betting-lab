name: Hits Model Study

# Does the dialled-in hits model (rink scorer, measured shrinkage, recency,
# a spread measured inside each player's own games) price hits better,
# walk-forward on outcomes and against the bought hits prices? (Cooper,
# 2026-10-25.) See scripts/run_hits_model_study.py.
#
# It fetches no odds, spends no credit, places no bet, pushes nothing,
# uploads nothing and edits no policy. The bought prices are restored onto
# the runner and never leave it; the result is aggregate and goes to the run
# summary and log only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_hits_model_study.py"
      - ".github/workflows/hits-model-study.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: hits-model-study
  cancel-in-progress: false

jobs:
  measure:
    name: Hits Model Study
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores and the bought prices
        # As Experiment Refresh restores them. Bought prices cannot be
        # regenerated, so their absence stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          if [ ! -s data/processed/historical_prop_prices.csv ]; then
            echo "::error::The bought prop prices did not restore (they expire from CI on 2026-11-29), so there is nothing to price against."
            exit 1
          fi
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Measure every hits variant
        env:
          PYTHONPATH: src
        run: |
          set -u
          status=0
          python scripts/run_hits_model_study.py || status=$?
          if [ -s data/outputs/hits_model_study.md ]; then
            cat data/outputs/hits_model_study.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # The bought prices leave the workspace before the job ends.
          rm -f data/processed/historical_prop_prices.csv
          exit "$status"
