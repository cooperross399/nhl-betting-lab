name: DFS Projection Test

# Do the lab's DraftKings projections (sent to Cooper's DFS app, The Lineup)
# land closer to what players score than DraftKings' own average, and than
# the app's formula before 2026-10-11? Walk-forward over every player-game the
# props model could price; see scripts/run_dfs_projection_test.py.
#
# It fetches no odds, spends no credit, places no bet, pushes nothing, uploads
# nothing and records nothing the card reads. The bought prices are restored
# onto the runner (for the books'-means column) and never leave it; the result
# is aggregate (errors and intervals) and goes to the run summary only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_dfs_projection_test.py"
      - "src/nhl_betting_lab/dfs_projections.py"
      - ".github/workflows/dfs-projection-test.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dfs-projection-test
  cancel-in-progress: false

jobs:
  measure:
    name: DFS Projection Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores and the bought prices
        # As the Props Form Test restores them. Without the bought prices the
        # books'-means column is skipped and the rest is still measured.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          if [ ! -s data/processed/historical_prop_prices.csv ]; then
            echo "::warning::The bought prop prices did not restore (they expire from CI on 2026-11-29), so the books'-means column is not measured."
          fi
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Measure the projections
        env:
          PYTHONPATH: src
        run: |
          set -u
          status=0
          python scripts/run_dfs_projection_test.py || status=$?
          if [ -s data/outputs/dfs_projection_test.md ]; then
            cat data/outputs/dfs_projection_test.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # The bought prices leave the workspace before the job ends.
          rm -f data/processed/historical_prop_prices.csv
          exit "$status"
