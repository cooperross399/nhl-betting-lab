name: Experiment Refresh

# Does the lab still believe what it believed?
#
# The card's behaviour follows `verdicts.ships()`, which reads decisions from
# tracked JSON files. Every experiment that produced those decisions has only
# ever been run BY HAND, so a policy that stopped being right in November
# would keep shipping until somebody happened to re-run it. Over a season
# that is the difference between a lab that improves as evidence accumulates
# and one that improves when someone remembers.
#
# So every experiment re-runs weekly against everything known by then, and
# the verdicts it produces are compared with the verdicts in the repository.
#
# WHAT IT WILL NOT DO. It does not edit the live verdicts, and it does not
# touch the card. A scheduled job that silently rewrites the card's policy
# mid-season is indistinguishable from tuning, and it would corrupt the
# forward-evidence test that runs until 2027-04-25 (docs/when_this_ends.md).
# A moved verdict opens a PULL REQUEST carrying the evidence, and a human
# decides. Detection is automatic; application is not.
on:
  schedule:
    # Mondays, after the weekend's results are in and settled.
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: experiment-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-decide everything
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the accumulated state
        # The experiments need the boxscore cache, the processed tables and
        # the bought prices. Without them this job re-decides nothing on no
        # data and reports a false "nothing moved".
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # Each artifact from the newest run of each workflow that carries
          # it, whatever its conclusion; a skipped run is a success with no
          # artifact and used to be chosen. Later workflows are laid over
          # earlier ones, as before. See scripts/restore_state.py.
          #
          # A failure to ask GitHub stops the run; it is never an absence.
          # This used to end `|| true` with neither flag, so one HTTP 502
          # while listing or downloading the purchase runs was recorded and
          # passed over: the bought prices came from an older run, or from
          # the older copy gameday-state carries, the check below passed on
          # that file, and every verdict was re-decided on prices nobody
          # knew were old. With no older copy it failed as "the bought prices
          # did not restore", naming an absence where GitHub had not
          # answered. --refuse-unreachable exits 1 on a listing or download
          # that fails after --attempts tries, as Historical Props Purchase's
          # restores of the same prices do. A listing that answers and holds
          # no carrier still exits 0, and the checks below decide on what
          # arrived, as before.
          #
          # --record-run writes the run each pair restored from, or nothing
          # when the listing answered and no run carries it. The price check
          # below reads these to tell an expiry from a breakage.
          carriers=$(mktemp -d)
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 \
                --record-run "$carriers/$wf.$name" || {
                echo "::error::GitHub could not be reached to restore $name from $wf (gh's own words are above). Re-deciding without it would decide on older or missing inputs and report the result as this week's verdicts, so this run stops. Dispatch it again once GitHub answers."
                exit 1
              }
            done
          done
          # FINAL boxscores only, the same states as nhl_api.game_is_final.
          # This counted every file, and until fetch_boxscore stopped caching
          # non-final answers Gameday Refresh left one per scheduled game in
          # the state this restores, so a thin cache padded with a season of
          # future games cleared the floor. `|| true`: grep exits non-zero on
          # a missing cache or one with no final game, which under pipefail
          # would end the step before the error below could say why. `tr`:
          # BSD wc pads its count, and the suite runs this block on macOS too.
          games=$(grep -rliE --include='*.json' '"gameState":[[:space:]]*"(OFF|FINAL)"' data/raw/nhl/boxscore 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "Boxscores restored: $games"
          if [ "$games" -lt 500 ]; then
            echo "::error::Only $games boxscores restored. Re-deciding on a thin cache would report a verdict change that is really a data shortage."
            exit 1
          fi
          # Boxscores alone are not enough and the first firing proved it:
          # every experiment needs the BOUGHT PRICES and the walk-forward
          # samples, neither of which arrived, so all three exited with
          # "Need both the walk-forward samples and the bought prices on
          # disk" and the run still reported "nothing moved". A refresh that
          # cannot re-decide must fail here rather than produce a clean bill
          # from stale files.
          # The bought prices cannot be regenerated - they were paid for -
          # so their absence is fatal. The walk-forward samples CAN be, and
          # depending on another workflow having left them in an artifact is
          # what made the first firing re-decide nothing. A refresh that can
          # build its own inputs does not need anyone else to have run.
          #
          # EXCEPT WHEN THEY EXPIRED, WHICH WAS DECIDED. The bought prices
          # live in CI only in the artifacts of Historical Props Purchase
          # (newest carrier run 33450963332, both artifacts expiring
          # 2026-11-29). On 2026-09-25 the owner decided to let them expire
          # rather than give them another home: this repository is public and
          # the provider's terms forbid redistributing bought prices as
          # downloadable files. After that date every run of this job would
          # fail here, every week, for a known reason, which is noise, not
          # news. So one case is told apart from a breakage: every restore
          # above exited 0 (so every listing answered and no carrier's
          # download failed), no price file arrived, AND none of the three
          # pairs that carry bought prices restored anything - the listing
          # answered and no run carries them. Then the price-dependent steps
          # (all three experiments, and the drift check that compares
          # their output) are skipped with a notice, the rest still runs,
          # and the run is green. Anything else stays red: a carrier that
          # restored and brought no prices, or a pair whose record is missing
          # (so nothing established that no run carries it).
          if [ ! -s data/processed/historical_prop_prices.csv ]; then
            held=""
            for pair in gameday-refresh.yml.historical-props \
                        historical-props-purchase.yml.historical-props \
                        historical-props-purchase.yml.gameday-state; do
              if [ ! -f "$carriers/$pair" ]; then
                held="$held $pair (no record of what its restore found)"
              elif [ -s "$carriers/$pair" ]; then
                held="$held $pair (run $(tr -d '\n' < "$carriers/$pair"))"
              fi
            done
            if [ -n "$held" ]; then
              echo "::error::The bought prices did not restore, although no run was established to hold none:$held. They cannot be regenerated, so this run could re-decide nothing. That is a broken refresh, not a clean one."
              exit 1
            fi
            echo "::notice::The bought prices have expired from CI, as decided on 2026-09-25: GitHub answered and no run of historical-props-purchase.yml (or gameday-refresh.yml) on main still carries historical-props or the purchase's gameday-state. So the three experiments and the verdict drift check were not run, and the committed data/outputs/*_experiment.json and *_experiment.md stand, measured when they were committed; verdicts.ships() reads them unchanged. To re-decide, run the experiments locally against a checkout whose data/processed holds the bought prices (see README, Experiment Refresh). Everything else in this run still ran."
            echo "prices=expired" >> "$GITHUB_OUTPUT"
          else
            echo "restored $(wc -l < data/processed/historical_prop_prices.csv) lines of bought prices"
          fi
          if [ ! -s data/outputs/prop_calibration_samples.csv ]; then
            echo "::warning::The walk-forward samples did not restore; building them. This is slower but self-sufficient."
          fi
          # The processed tables first: the calibration reads player game
          # logs, which build_datasets writes from the boxscore cache. The
          # previous attempt tried to build samples before the table they
          # are built from existed, and reported "No player logs" — a
          # dependency chain surfaced one layer per firing, which is what
          # firing a never-run workflow is for.
          PYTHONPATH=src python scripts/build_datasets.py || true
          # Restored samples are checked, not trusted. They used to be kept
          # whenever the file restored, and nothing in them said which
          # back-to-back policy made them or which games they had seen, so
          # the correction experiment could decide on a policy the card no
          # longer runs. --reuse-samples keeps them only when they record the
          # verdict in this checkout and priced every game in the logs, and
          # builds them otherwise — including when none restored.
          PYTHONPATH=src python scripts/run_props_calibration.py --reuse-samples || true
          if [ ! -s data/outputs/prop_calibration_samples.csv ]; then
            echo "::error::The walk-forward samples are absent and could not be built, so every experiment would exit without deciding. Broken refresh."
            exit 1
          fi
          echo "samples: $(wc -l < data/outputs/prop_calibration_samples.csv) lines"

      - name: Note when this run started
        # BEFORE the experiments, which is the only placement that means
        # anything. Its own name said "when this run started" and it sat
        # after the work, so every verdict file predated it and all three
        # read as "not re-decided" — including the one experiment that had
        # just completed successfully and written its report.
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Re-run every experiment
        # Every experiment reads the bought prices, so none runs once they
        # have expired (see the restore). Written as "not expired" so that a
        # restore that never set the output runs them, and fails, as before.
        if: steps.restore.outputs.prices != 'expired'
        env:
          PYTHONPATH: src
        run: |
          set -u
          python scripts/build_datasets.py || true
          for s in run_correction_experiment run_rest_experiment run_props_rest_experiment; do
            echo "::group::$s"
            python "scripts/$s.py" || echo "::warning::$s did not complete"
            echo "::endgroup::"
          done

      - name: Has anything changed its mind?
        # Nothing was re-decided when the prices have expired, and run here
        # it would read every committed verdict as "not re-decided" (exit 2).
        id: drift
        if: steps.restore.outputs.prices != 'expired'
        env:
          PYTHONPATH: src
        run: |
          set +e
          python scripts/check_verdict_drift.py --since "${{ steps.started.outputs.at }}"
          echo "moved=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Fail if the refresh could not re-decide
        # Exit 2 means an experiment produced no file this run. Reporting
        # that as "nothing moved" is how a stale belief gets confirmed by a
        # job built to catch stale beliefs.
        if: steps.drift.outputs.moved == '2'
        run: |
          echo "::error::The refresh re-decided nothing — at least one experiment produced no verdict file. Its 'nothing moved' is not a clean bill."
          exit 1

      - name: Open a pull request when a verdict moved
        # The evidence goes to a human, never straight to the card.
        if: steps.drift.outputs.moved == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          BRANCH="verdict-drift-$(TZ=America/New_York date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/outputs/*_experiment.json data/outputs/*_experiment.md \
                  data/outputs/verdict_drift.md 2>/dev/null || true
          git commit -m "A recorded verdict moved on the accumulated data" \
            -m "$(cat data/outputs/verdict_drift.md)" || exit 0
          git push -u origin "$BRANCH"
          gh pr create --title "A recorded verdict moved on the accumulated data" \
            --body-file data/outputs/verdict_drift.md

      - name: Keep the evidence
        # Not when the prices have expired: the files here would be the
        # committed copies, not this run's evidence, under a name that says
        # they are.
        if: always() && steps.restore.outputs.prices != 'expired'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-refresh
          path: |
            data/outputs/verdict_drift.md
            data/outputs/*_experiment.md
            data/outputs/*_experiment.json
          if-no-files-found: warn
          retention-days: 90

      - name: Say what this run did not do
        if: always()
        env:
          PRICES: ${{ steps.restore.outputs.prices }}
        run: |
          if [ "$PRICES" = expired ]; then
            echo "This job re-decided nothing: the bought prices have expired from CI,"
            echo "so the committed verdicts stand as they were committed."
          else
            echo "This job re-decided every experiment on the data known today."
          fi
          echo "It placed no bet, edited no live policy, allowlisted nothing,"
          echo "and changed the card not at all. A moved verdict is a pull"
          echo "request for a human, never an automatic edit."
