name: Hits Source Probe

# Which books, in which of the provider's regions, quote NHL hits right now?
# Every card since the 2026-10-27 morning run has excluded `hits` because the
# provider returned no rows in `us,us2`, where theScore Bet was its only book.
# Cooper asked (2026-11-03) for another hits source needing no new account,
# so this asks the regions the lab has never asked hits of. One upcoming
# event, one request per region and market, capped on measured spend. The
# report names books and outcome counts and records no price; nothing is
# uploaded. It places no bet, edits no policy and adds no market to the allowlist.

on:
  workflow_dispatch:
    inputs:
      credit_cap:
        description: "Hard cap on credits for this run. Required."
        type: string
        required: true
        default: "30"
      regions:
        description: "Comma-separated provider regions, one request each"
        type: string
        required: false
        default: "us,us2,us_dfs,us_ex,eu,uk,au"
      events:
        description: "How many upcoming events to ask about"
        type: string
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    name: Hits source probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Report the quota before spending any of it
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_quota.py \
            --fail-under "${{ inputs.credit_cap }}"

      - name: Ask who quotes hits
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/probe_hits_sources.py --live \
            --credit-cap "${{ inputs.credit_cap }}" \
            --regions "${{ inputs.regions }}" \
            --events "${{ inputs.events }}"

      - name: Write the result to the run summary
        if: always()
        run: |
          {
            echo "## Hits source probe"
            echo
            cat data/outputs/hits_source_probe.md 2>/dev/null \
              || echo "No probe report was produced."
          } >> "$GITHUB_STEP_SUMMARY"
