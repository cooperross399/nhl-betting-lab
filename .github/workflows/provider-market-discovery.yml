name: Provider Market Discovery

# Answers "which books quote which markets, on which lines, for how much of
# the slate" — including the alternate ladders.
#
# This exists because of one specific mistake. In the EPL lab a market was
# written off for a season on a coverage check that examined only the bulk
# endpoint, while the complete line sat in the alternate ladder the whole
# time. Before any market is recorded as unavailable, run this.
#
# SCOPE: fetches prices into staging and writes a report. It allowlists
# nothing, promotes nothing, places no bet, and the card cannot read what it
# writes.
#
# COST: the bulk fetch is a handful of credits. Props are opt-in and capped.
on:
  workflow_dispatch:
    inputs:
      include_props:
        description: "Also probe player prop coverage (costs credits per event)"
        type: boolean
        required: false
        default: false
      credit_cap:
        description: "Hard cap on per-event credits (19 markets asked; 380 = 20 events)"
        type: string
        required: false
        default: "380"
      probe_every_market:
        description: "Ask about every candidate market individually (~1 credit each)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  discover:
    name: Provider market discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check the provider credential
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py

      - name: Ask about every candidate market individually
        # Guessing a market list is how every team-market fetch failed for a
        # week: `alternate_spreads` is real, documented, and not served on the
        # bulk endpoint, and asking for it there makes the provider refuse the
        # whole request with a 422 that names nothing. Asking one at a time
        # means a single bad name cannot hide the others.
        if: ${{ inputs.probe_every_market == true }}
        continue-on-error: true
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/discover_nhl_markets.py --live \
            --credit-cap "${{ inputs.credit_cap || '60' }}"

      - name: Fetch and report coverage
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          # --horizon-days 0 because this IS the probe: it must ask about
          # the whole posted board, not today's slate. A windowed probe run
          # on an off-day would fetch nothing, report every per-event market
          # at zero coverage, and read as "still not quoted" — writing a
          # live market off for the wrong reason, which is the exact mistake
          # this workflow exists to prevent.
          #
          # The cap is read against the number of markets asked (19), so a
          # cap that was six events when ten were asked is three today. A
          # starved probe and an unquoted market look identical in the
          # coverage table, so the cap has to be scaled deliberately.
          # --max-events is what makes the coverage table honest. The cap
          # buys twenty events; without the same limit on the bulk fetch the
          # slate would be the whole board and every per-event market would
          # report "20 of 32 games — incomplete", which reads as "no book
          # covers the slate" when the truth is "the budget stopped at
          # twenty". A starved probe and an unquoted market must never look
          # alike here: telling them apart is the entire job of this
          # workflow.
          python scripts/run_provider_shadow.py --live --overwrite-staging \
            --horizon-days 0 --max-events 20 \
            ${{ inputs.include_props == true && '--props' || '' }} \
            --credit-cap "${{ inputs.credit_cap || '380' }}"

      - name: Write the coverage report to the run summary
        if: always()
        run: |
          {
            echo "## Provider market discovery"
            echo
            if [ -f data/outputs/nhl_market_discovery.json ]; then
              echo "### Markets the provider serves"
              echo
              echo '```json'
              cat data/outputs/nhl_market_discovery.json
              echo '```'
              echo
            fi
            cat data/outputs/provider_market_discovery.md 2>/dev/null \
              || echo "No coverage report was produced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discovery
          path: |
            data/outputs/provider_market_discovery.md
            data/outputs/provider_shadow_verification.md
            data/outputs/provider_shadow_verification.json
            data/outputs/nhl_market_discovery.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm the boundary
        if: always()
        run: |
          echo "This job fetched prices into staging and wrote a report."
          echo "It allowlisted nothing, promoted nothing, edited no policy,"
          echo "wrote no receipt, and placed no bet. The card cannot read"
          echo "the files it wrote."
