name: Shots Model Study

# Does shots on goal's own-games spread price shots better, walk-forward on
# outcomes, against the bought card-window prices, and replayed on the
# forward ledger? The ship rule is docs/sog_dispersion_decision_rule.md.
# See scripts/run_sog_model_study.py. With `study: over_rule` it runs
# scripts/run_sog_over_rule_study.py instead: would a stricter rule for shots
# overs have helped, under docs/sog_over_rule_decision_rule.md?
#
# It fetches no odds, spends no credit, places no bet, pushes nothing,
# uploads nothing and edits no policy. The bought prices are restored onto
# the runner and never leave it; the result is aggregate and goes to the run
# summary and log only.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "spread (own-games spread) or over_rule (stricter shots-over rule)"
        type: choice
        options:
          - spread
          - over_rule
        default: spread
  pull_request:
    paths:
      - "scripts/run_sog_model_study.py"
      - "scripts/run_sog_over_rule_study.py"
      - ".github/workflows/sog-model-study.yml"
      - "docs/sog_dispersion_decision_rule.md"
      - "docs/sog_over_rule_decision_rule.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: sog-model-study
  cancel-in-progress: false

jobs:
  measure:
    name: Shots Model Study
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores and the bought prices
        # As Experiment Refresh restores them. Bought prices cannot be
        # regenerated, so their absence stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          if [ ! -s data/processed/historical_prop_prices.csv ]; then
            echo "::error::The bought prop prices did not restore (they expire from CI on 2026-11-29), so there is nothing to price against."
            exit 1
          fi
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Measure every shots variant
        env:
          PYTHONPATH: src
          STUDY: ${{ github.event.inputs.study || 'spread' }}
        run: |
          set -u
          status=0
          if [ "$STUDY" = "over_rule" ]; then
            report=data/outputs/sog_over_rule_study.md
            python scripts/run_sog_over_rule_study.py || status=$?
          else
            report=data/outputs/sog_model_study.md
            python scripts/run_sog_model_study.py || status=$?
          fi
          if [ -s "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The bought prices leave the workspace before the job ends.
          rm -f data/processed/historical_prop_prices.csv
          exit "$status"
