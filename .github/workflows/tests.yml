name: Tests

# Runs the full suite on every pull request and on main. This is what makes
# "CI is green" mean the suite passed. It uses no secrets and fetches no odds,
# so it is safe to run on any branch and on a fork.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The secrets guard runs `git ls-files`, so it needs a real
          # work tree, and `git check-ignore`, which needs .gitignore.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile every module
        # A module can be syntactically invalid and still pass the suite if no
        # test imports it. In the EPL lab one sat broken for over a month that
        # way, failing only the scheduled job nobody reads.
        run: |
          python -m compileall -q src scripts

      - name: Run the full test suite
        # No credential is provided on purpose: every test must pass without
        # one. A test that needed a live key would make the suite unrunnable on
        # a fork and would risk exposing the key in a log.
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q

      - name: Confirm no odds were fetched
        if: always()
        run: |
          echo "This job installs the project and runs unit tests only."
          echo "It uses no repository secret, makes no provider request,"
          echo "places no bets, and runs on demand or on pull requests."
