name: Tests

# Runs the full suite on every pull request and on main. This is what makes
# "CI is green" mean the suite passed. It uses no secrets and fetches no odds,
# so it is safe to run on any branch and on a fork.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PYTHONSAFEPATH keeps the checked-out repository OUT of sys.path. It is
    # declared for the whole job rather than on the suite step, because
    # `python -m <tool>` resolves <tool> against the working directory before
    # site-packages on EVERY step that starts an interpreter. Measured on this
    # branch: a three-line `pyflakes.py` at the repository root, printing one
    # clean line and exiting 0, satisfied the lint step while a module under
    # `src/` held an unused import and an undefined name; a `compileall.py` did
    # the same to the compile step with a syntax error sitting in `src/`. Set
    # here, a step added later inherits it, and the linter in
    # tests/test_workflows.py requires it in effect on every step whose block
    # names an interpreter -- wherever it is declared.
    #
    # It does NOT drop an explicit PYTHONPATH entry. `src/coverage.py` is still
    # imported ahead of the real tool with this set: measured, exit 0 and a
    # fabricated pass line. tests/test_the_guards_exist.py refuses a TRACKED
    # file or directory at the top of any import root this file declares whose
    # name is one this job launches with `python -m`, a start-up hook, or a
    # stdlib top-level name. Neither half reaches a file git does not track --
    # one an earlier step writes onto the runner, or one sitting in a working
    # copy. That residue is run, not argued, in tests/test_the_guards_exist.py
    # ::test_the_gaps_these_guards_still_have_are_the_ones_written_down.
    env:
      PYTHONSAFEPATH: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The secrets guard runs `git ls-files`, so it needs a real
          # work tree, and `git check-ignore`, which needs .gitignore.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Lint for dead names
        # Pyflakes catches exactly two things this repository has shipped
        # bugs through: an unused import left after a refactor, and an
        # undefined name that only fails on the code path no test happened
        # to walk. It ran locally all along; a check that runs only on one
        # machine is a check that runs only sometimes.
        run: |
          python -m pyflakes src scripts tests

      - name: Compile every module
        # A module can be syntactically invalid and still pass the suite if no
        # test imports it. In the EPL lab one sat broken for over a month that
        # way, failing only the scheduled job nobody reads.
        #
        # Each directory is asserted to exist first, because
        # `python -m compileall -q missing/` prints "Can't list" and exits 0 —
        # measured, not assumed — so a renamed directory would compile nothing
        # and pass. `-f` because a stale .pyc makes a broken module look
        # compiled. tests/test_workflows.py runs this block under stubs with
        # the directories absent and demands a non-zero exit.
        run: |
          for directory in src scripts tests; do
            test -d "$directory" || { echo "::error::$directory is missing"; exit 1; }
          done
          python -m compileall -q -f src scripts tests

      - name: Run the full test suite
        # No credential is provided on purpose: every test must pass without
        # one. A test that needed a live key would make the suite unrunnable on
        # a fork and would risk exposing the key in a log.
        #
        # The shadowing this line is exposed to, and what covers which half of
        # it, is written out on the job's `env:` above. PYTHONSAFEPATH comes
        # from there; PYTHONPATH is per-step because only the two coverage
        # steps need it.
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m pytest -q

      - name: Check coverage has not collapsed
        # A floor, not a target. It catches a module arriving with no tests or
        # a large deletion of them; it is deliberately well below where the
        # suite sits, so an honest refactor never becomes a negotiation about
        # a percentage.
        env:
          PYTHONPATH: src
        run: |
          python -m coverage report

      - name: Confirm no odds were fetched
        if: always()
        run: |
          echo "This job installs the project and runs unit tests only."
          echo "It uses no repository secret, makes no provider request,"
          echo "places no bets, and runs on demand or on pull requests."
