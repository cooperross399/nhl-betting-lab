name: Tests

# Runs the full suite on every pull request and on main. This is what makes
# "CI is green" mean the suite passed. It uses no secrets and fetches no odds,
# so it is safe to run on any branch and on a fork.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The secrets guard runs `git ls-files`, so it needs a real
          # work tree, and `git check-ignore`, which needs .gitignore.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Lint for dead names
        # Pyflakes catches exactly two things this repository has shipped
        # bugs through: an unused import left after a refactor, and an
        # undefined name that only fails on the code path no test happened
        # to walk. It ran locally all along; a check that runs only on one
        # machine is a check that runs only sometimes.
        run: |
          python -m pyflakes src scripts tests

      - name: Compile every module
        # A module can be syntactically invalid and still pass the suite if no
        # test imports it. In the EPL lab one sat broken for over a month that
        # way, failing only the scheduled job nobody reads.
        #
        # Each directory is asserted to exist first, because
        # `python -m compileall -q missing/` prints "Can't list" and exits 0 —
        # measured, not assumed — so a renamed directory would compile nothing
        # and pass. `-f` because a stale .pyc makes a broken module look
        # compiled. tests/test_workflows.py runs this block under stubs with
        # the directories absent and demands a non-zero exit.
        run: |
          for directory in src scripts tests; do
            test -d "$directory" || { echo "::error::$directory is missing"; exit 1; }
          done
          python -m compileall -q -f src scripts tests

      - name: Run the full test suite
        # No credential is provided on purpose: every test must pass without
        # one. A test that needed a live key would make the suite unrunnable on
        # a fork and would risk exposing the key in a log.
        #
        # PYTHONSAFEPATH keeps the checkout OUT of sys.path. `python -m
        # coverage` puts the working directory first otherwise, so a file named
        # `coverage.py` at the repository root shadows the tool this line
        # launches: measured, a three-line one printing "1521 passed in 0.01s"
        # and exiting 0 satisfied the whole step. The same is true of a root
        # `pytest.py`. tests/test_the_guards_exist.py refuses such a file at
        # the tracked level; this closes the untracked half, on the runner.
        env:
          PYTHONPATH: src
          PYTHONSAFEPATH: "1"
        run: |
          python -m coverage run -m pytest -q

      - name: Check coverage has not collapsed
        # A floor, not a target. It catches a module arriving with no tests or
        # a large deletion of them; it is deliberately well below where the
        # suite sits, so an honest refactor never becomes a negotiation about
        # a percentage.
        env:
          PYTHONPATH: src
        run: |
          python -m coverage report

      - name: Confirm no odds were fetched
        if: always()
        run: |
          echo "This job installs the project and runs unit tests only."
          echo "It uses no repository secret, makes no provider request,"
          echo "places no bets, and runs on demand or on pull requests."
