name: Season Sim

# Plays the rest of the NHL season ten thousand times and hands the result to
# the public site.
#
# Runs every morning, after the previous night's games are final and before
# Publish Site's 14:45 UTC build. It reads public endpoints only — the NHL
# API for standings, rosters, schedules and season-to-date stats, MoneyPuck
# for expected goals — and the hand-kept availability list under
# data/season_sim/roster_notes.json — plus the card's own team ratings,
# restored from Gameday Refresh's state. It fetches no odds, spends no credit,
# pushes no branch, edits no policy, and places no bet.
#
# The output is one file, season.json, uploaded as the `season-sim` artifact.
# Publish Site lays it over the committed baseline at web/data/season.json;
# when no run has produced one, or the newest cannot be downloaded, the site
# keeps the baseline and says how old it is. A red run here never blocks a
# publish: the board must not go dark because a projection did not build.
on:
  schedule:
    - cron: "5 13 * * *"   # 09:05 New York; finals are in, the site builds at 10:45
  workflow_dispatch:
    inputs:
      sims:
        description: Simulated seasons (default 10,000).
        type: number
        default: 10000

permissions:
  contents: read
  actions: read   # to restore the card's team ratings and the last projection

concurrency:
  group: season-sim
  cancel-in-progress: false

jobs:
  simulate:
    name: Season Sim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the card's team ratings
        # Cooper, 2026-10-26: the season's team strengths come from the same
        # PostHockey-style ratings the card prices on (shooter-adjusted xG
        # with GSAx(sh) and each club's own home ice), which Gameday Refresh
        # builds into data/processed/shadow_team_ratings.json and carries in
        # its `gameday-state` artifact. Only that one file is kept. Soft: the
        # projection builds on its own ratings without it, says so in the
        # log and on the page, and a ratings file more than a few days older
        # than the standings is ignored by the model, not blended.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          STATE=/tmp/gameday-state
          mkdir -p "$STATE" data/processed
          if python scripts/restore_state.py --artifact gameday-state --dest /tmp/gameday-state \
               --workflow gameday-refresh.yml --no-merge --attempts 2 \
             && [ -s "$STATE/processed/shadow_team_ratings.json" ]; then
            cp "$STATE/processed/shadow_team_ratings.json" data/processed/
            python -c "import json; d = json.load(open('data/processed/shadow_team_ratings.json')); print('Card ratings through', d['last_game_date'])"
          else
            echo "::warning::The card's team ratings could not be restored; the season is simulated on its own ratings."
          fi
          rm -rf "$STATE"

      - name: Restore the last projection
        # Its daily award rankings are carried forward, so each name on the
        # Season page gets a trend line. Soft: without it the lines start
        # today. Unpacked where the artifact is rooted, then moved straight
        # out of dist to the runner's temp directory, so it can never be
        # handed on in place of today's.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/previous-season"
          if python scripts/restore_state.py --artifact season-sim --dest dist/data \
               --workflow season-sim.yml --success-only --no-merge --attempts 2; then
            mv dist/data/season.json "$RUNNER_TEMP/previous-season/season.json"
          else
            echo "::warning::The last season projection could not be restored; the award trend lines start today."
          fi
          rm -rf dist/data

      - name: Restore past seasons' stats
        id: history
        # The closed seasons the award models are fitted to (NHL and
        # MoneyPuck tables back to 2005-06). They never change, so they are
        # fetched once and kept; a cold cache costs about a hundred requests.
        uses: actions/cache/restore@v4
        with:
          path: data/raw/season_sim/history
          key: season-sim-award-history-v1-${{ hashFiles('data/season_sim/award_voting.csv') }}
          restore-keys: season-sim-award-history-v1-

      - name: Build the season projection
        # Every current input is fetched here, into a cache under data/raw
        # that no workflow restores: a projection built on last week's
        # rosters is worse than none, and the fetch is about ninety small
        # requests. Only the closed seasons under history/ are kept.
        env:
          PYTHONPATH: src
          SIMS: ${{ inputs.sims || 10000 }}
        run: |
          set -u
          PREV="$RUNNER_TEMP/previous-season/season.json"
          [ -s "$PREV" ] || PREV=""
          # Written under dist/data, the path Publish Site restores it to,
          # so the artifact's root and the restore's directory agree.
          python web/build_season_json.py --out dist/data --cache data/raw/season_sim --sims "$SIMS" \
            ${PREV:+--previous "$PREV"}
          test -s dist/data/season.json

      - name: Keep past seasons' stats for the next run
        if: always() && steps.history.outputs.cache-hit != 'true' && hashFiles('data/raw/season_sim/history/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/season_sim/history
          key: season-sim-award-history-v1-${{ hashFiles('data/season_sim/award_voting.csv') }}

      - name: Hand the projection to Publish Site
        uses: actions/upload-artifact@v4
        with:
          name: season-sim
          path: dist/data/season.json
          if-no-files-found: error
          retention-days: 30

      - name: Report the outcome
        if: always()
        run: |
          echo "This job projected the season from public NHL and MoneyPuck data."
          echo "It fetched no odds, spent no credit, pushed no branch, edited no policy,"
          echo "and placed no bet."
