name: Gameday Refresh

# The card is produced here, not on anyone's laptop. This workflow fetches
# results, fetches prices, rebuilds every report, renders the card, and posts
# it to the operating-home issue.
#
# THE NAME IS A CONTRACT. Cooper's scheduled Claude routines hard-code the
# workflow name "Gameday Refresh", the issue title "NHL Betting Lab — Claude
# Operating Home", the marker phrase "Selections changed", and the card-feed
# branch. Renaming any of them silently breaks his automation, and the
# breakage looks exactly like the lab going quiet.
#
# SCOPE: this refetches prices and rebuilds reports. It does NOT place a bet,
# allowlist a provider, widen market scope, edit the provider policy, or write
# a human acceptance receipt. Those remain human decisions and no schedule can
# take them.
#
# DESIGN RULE: a run never ends with nothing to show. Both external sources are
# outside this repository and will have bad days, so a failure downgrades the
# run rather than aborting it: the card is rebuilt from the last good state,
# the summary says exactly what went wrong, and the result is posted even if
# the selections did not change. The run still finishes red, so the failure
# notice arrives too. Silence therefore always means "it ran and nothing
# moved", which is the only thing that makes silence safe to read.
#
# CADENCE: the NHL plays almost every day from early October to mid-April, so
# this runs daily in season. Two triggers ninety minutes apart, because GitHub
# documents that scheduled workflows may be delayed or dropped entirely under
# load — a trigger that usually works is not a trigger a card can depend on.
# The refresh job's concurrency group serialises them and the second run only
# reposts if it has something new to say, so a duplicate run is invisible.
#
# COST: the bulk team-market fetch is a handful of credits (3 markets x 2
# regions = 6 a run). Player props and every other per-event market bill one
# credit per market per region per event: the fetch asks 19 markets at the
# lab's two regions (us,us2), 19 markets x 2 regions = 38 credits an event
# under the pessimistic bound — so the per-event fetch runs under a hard cap
# set here, and the run prints what it spent. That cap covers fewer games
# than the season's largest nights; see "Fetch prices into staging". (Until
# 2026-09-25 this said one credit per market per event, 72 credits for a
# twelve-game night across six markets: one region, and a third of the
# markets asked.)
on:
  schedule:
    # 13:30 UTC is 09:30 in New York: the card is in the inbox before the
    # morning read and well before any 19:00 local puck drop. The 15:00 backup
    # covers a dropped primary.
    #
    # EACH CRON FIRES EIGHT HOURS BEFORE ITS SLOT, and the `wait` jobs hold
    # the run until 13:30 or 15:00 (scripts/wait_for_round.py). GitHub starts
    # this repository's scheduled runs hours late (3.5-4.2 h on 2026-09-24,
    # 5.5-6.0 h on 2026-09-28): a 13:30 cron would land about 19:30, after
    # the routines that read the card and at the first 17:00 ET face-off.
    # Lateness up to eight hours now costs nothing. Moving a slot means
    # moving its cron to eight hours before it.
    - cron: "30 5 * 1-4,10-12 *"
    - cron: "0 7 * 1-4,10-12 *"
    # The season does not wait for October: 2026-27 opens September 29 with a
    # five-game slate the month filter above would silently skip. These two
    # days and no others, because a daily September schedule would spend real
    # credits pricing preseason games the card is only going to exclude.
    - cron: "30 5 29-30 9 *"
    - cron: "0 7 29-30 9 *"
  workflow_dispatch:
    inputs:
      skip_provider_fetch:
        description: "Rebuild reports from existing evidence without refetching prices"
        type: boolean
        required: false
        default: false
      props_credit_cap:
        description: "Hard cap on per-event credits for this run"
        type: string
        required: false
        default: "320"
      force_post:
        description: "Post the card even if the selections did not change"
        type: boolean
        required: false
        default: false

permissions:
  # Write, for exactly one ref: the card-feed branch, where each run publishes
  # the rendered comment and a status line so the cloud morning-brief routine
  # can read them over plain git. Nothing in this workflow pushes anywhere
  # else, and main only changes through pull requests.
  contents: write
  # Read-only, and only so the run can fetch the previous run's state.
  actions: read
  # Lets the run comment the card on an issue, which is what delivers it by
  # email. This writes issue comments and nothing else.
  issues: write

# Every `run:` block below runs as `bash --noprofile --norc -eo pipefail {0}`,
# which is what the comments in this file and every test that replays its
# steps assume. Until 2026-09-26 nothing here said so, and GitHub runs a
# block that names no shell as `bash -e {0}`: errexit with no pipefail. (Run
# 33142173149 printed `shell: /usr/bin/bash -e {0}` 14 times and pipefail not
# once.) Under that shell `NUMBER=$(gh issue list … | jq …)` took jq's status,
# and jq exits 0 on empty input, so a single HTTP 502 from the listing read
# as "no home issue exists". The post step then created, pinned and commented
# on a second "Operating Home" issue that every later card followed, and it
# recorded decision=post on a green step. The suite never saw this: rewriting
# its 275 pipefail replays to `bash -e` left all 2504 tests passing. Every
# pipeline in this file was audited for a left side that may exit non-zero
# before this was added. The two boxscore counts (`grep … | wc -l`, final
# boxscores only, in "Restore the previous state" and "Record what went
# wrong") carry `|| true` for exactly that reason: grep exits non-zero on a
# missing cache or one with no final game. (They were `find | wc -l` until
# 2026-09-26.) tests/test_the_post_step_fails_closed_under_the_runners_shell.py
# resolves each step's shell from this file the way GitHub does and pins it.
defaults:
  run:
    shell: bash

jobs:
  # Hold a scheduled run until its slot. Two jobs, because one may run for at
  # most six hours and a slot can be eight away; each waits at most 340
  # minutes and the second recomputes the slot from the same cron. A manual
  # dispatch does not wait. No install, no secret, no credit.
  wait:
    name: Wait for the slot
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/wait_for_round.py --schedule "$SCHEDULE" --budget-minutes 340

  wait-more:
    name: Wait for the slot (continued)
    needs: wait
    # A wait that failed must not cost the card: run late rather than not at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/wait_for_round.py --schedule "$SCHEDULE" --budget-minutes 340

  precheck:
    # The second scheduled trigger exists only to cover a dropped first one,
    # and when the first one worked it has nothing to add: it would refetch
    # the same slate for the same credits, then republish the same card. Over
    # the 185 nights of 2026-27 that duplicate could bill up to 42,530
    # credits at the 320 cap and two regions (41,420 per-event, 1,110 bulk) —
    # as much again as the primary — spent to learn nothing. (This said
    # 26,091 until 2026-09-25: the uncapped figure at one region.)
    #
    # So a scheduled run first asks the card-feed branch whether today's card
    # is already published and clean. If it is, the whole job is skipped. A
    # manual dispatch never skips: asking for a run by hand means run it.
    name: Already published?
    # After the wait, so the backup asks at 15:00 whether the 13:30 card is
    # out, not at whatever hour GitHub started it.
    needs: wait-more
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      already: ${{ steps.feed.outputs.already }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: never skipped."
            exit 0
          fi
          DAY=$(TZ=America/New_York date +%F)
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          if ! git fetch "$REMOTE" +refs/heads/card-feed:refs/card-feed-tip 2>/dev/null; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "No card-feed branch yet; running."
            exit 0
          fi
          STATUS=$(git show refs/card-feed-tip:latest_status.json 2>/dev/null || echo '{}')
          FEED_DAY=$(printf '%s' "$STATUS" | jq -r '.date // ""')
          DEGRADED=$(printf '%s' "$STATUS" | jq -r '.degraded // "unknown"')
          FEED_REF=$(printf '%s' "$STATUS" | jq -r '.ref // ""')
          # A scheduled run only ever runs on the default branch, so its own
          # ref IS the default branch. It is read from there rather than from
          # `github.event.repository`, which this lab has never seen populated
          # on a cron run. An empty ref cannot happen on a schedule; were it
          # to, this says so and runs, because failing here would skip the
          # refresh job and leave the day with no card at all.
          RUN_REF="${{ github.ref }}"
          if [ -z "$RUN_REF" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This scheduled run could not read its own ref, so it cannot tell whether card-feed's status came from the default branch. Running rather than trusting it."
            exit 0
          fi
          # Only a CLEAN card for today, published by the DEFAULT branch,
          # counts. A degraded run is exactly the case the backup trigger
          # exists for, so it must not satisfy it. Nor may a run dispatched on
          # a feature branch: the publish step no longer runs there, but every
          # branch cut before 2026-09-26 still carries the copy that did, and
          # its status line names no ref. Such a line costs at most one
          # duplicate run on the day this landed; trusting it would cost the
          # day's card and its frozen opinions.
          #
          # And only a card BUILT for today. The status was dated by the clock
          # when it was published, which is the last thing a run does: a main
          # dispatch that built a clean card at 23:56 ET and published at
          # 00:03 stamped the next day, and that day's 13:30 and 15:00 runs
          # both stood down, green, with no card and no frozen snapshot. The
          # publish step now records the league day the card was built for
          # as `card_day`. A status with none (no card on disk, or written
          # before 2026-09-29) never counts; like the ref check, that costs at
          # most one duplicate run on the day this lands.
          FEED_CARD_DAY=$(printf '%s' "$STATUS" | jq -r '.card_day // ""')
          if [ "$FEED_DAY" = "$DAY" ] && [ "$FEED_CARD_DAY" = "$DAY" ] \
             && [ "$DEGRADED" = "false" ] \
             && [ "$FEED_REF" = "$RUN_REF" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Today's card ($DAY) is already published and clean. Skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Feed day '$FEED_DAY' (card built for '$FEED_CARD_DAY', degraded=$DEGRADED, ref='$FEED_REF') is not a clean card for $DAY from the default branch. Running."
          fi

  refresh:
    name: Gameday Refresh
    needs: precheck
    # Spelled out: a bare condition carries an implicit success() over every
    # job upstream, so a failed wait would skip the day's card.
    if: ${{ !cancelled() && needs.precheck.result == 'success' && needs.precheck.outputs.already != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # On the job, not the workflow: scheduled runs wait for hours, and a
    # workflow-level group would hold a waiting run in the one pending slot,
    # where the next run cancels it. Refreshes still never run two at once.
    concurrency:
      group: gameday-refresh
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Note the league day this run is for
        # Once, at the start. The card-feed status is dated by the card's own
        # league day, and this is what it falls back to when there is no
        # card on disk to read it from; never the clock at publish, which on
        # a late dispatch is already the next day.
        run: TZ=America/New_York date +%F > run_league_day.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the previous state
        # A runner starts empty, and neither the boxscore cache nor the
        # processed tables are tracked in git. Without this, every run begins
        # with no memory of the last one: the "selections changed" diff stays
        # permanently blank, so every card looks like a change and the marker
        # stops meaning anything.
        #
        # Additive and scoped to data/, so it cannot overwrite the prices this
        # run is about to fetch. A first run or a pruned artifact is not fatal.
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p data
          # From the newest run that CARRIES the state, whatever its
          # conclusion, with the newest successful state laid underneath a
          # red one. "The newest successful run" was wrong twice: a skipped
          # backup is a success with no artifact, so the next run started
          # cold for good; and a degraded run's cache and frozen snapshot
          # were never restored, so a cold cache could never fill. See
          # scripts/restore_state.py. The purchase workflow uploads the same
          # artifact and is the fallback when no refresh run carries one —
          # without it the very first refresh refetches four thousand
          # boxscores already sitting in an artifact.
          #
          # Three attempts at every listing and download, and a record of
          # whatever still could not be asked, which "Record what went
          # wrong" turns into a degraded run. This made one attempt and
          # read a failed listing as "no refresh run carries it": one HTTP
          # 502 restored the purchase's state, which has no snapshot
          # archive, so the snapshot frozen the day before never settled,
          # the run was green, and the next run restored that green run
          # with nothing laid underneath — the day's frozen opinions left
          # the forward ledger for good. A failed listing no longer falls
          # through to the purchase at all, and a red run is what makes the
          # next restore lay every older carrier down to the last good state
          # underneath and bring the missed snapshot back — a red run's too,
          # and it stands over a later run's freeze of the same day.
          python scripts/restore_state.py --artifact gameday-state --dest data \
            --workflow gameday-refresh.yml --workflow historical-props-purchase.yml \
            --attempts 3 --problem-file restore_problem.txt \
            || echo "::warning::The previous state could not be restored; this run starts without it."
          # The state carries the previous run's staged prices, for Publish
          # Site. They must not outlive the restore here: "Fetch prices into
          # staging" replaces them only when it fetches, so a skipped or
          # failed fetch would leave an earlier run's quotes on disk, and the
          # upload below would hand them to the board as today's. The card
          # refuses prices over the policy's age; the board reads no age.
          # What this run stages is this run's fetch, or nothing, as before
          # the state carried them.
          rm -f data/staging/*.csv data/staging/staging_provenance.json
          # Nothing above exits early: the ledger fallback below must run
          # whenever the ledger did not come back, however the restore ended.
          if [ -f data/outputs/gameday_card.json ]; then
            # Moved, not copied: a card step that crashes must leave NO card
            # on disk. A copy left yesterday's card at today's path, and the
            # post and card-feed steps published it as today's.
            mv data/outputs/gameday_card.json previous_card.json
            echo "Restored the previous card for the selections diff."
          fi
          # `|| true`: the shell is `bash -eo pipefail` (declared under
          # `defaults:` above), and with nothing restored, or nothing final,
          # `grep` fails. That would end the step here, before the ledger
          # fallback below. FINAL boxscores only, as "Record what went wrong"
          # counts them: a restored cache can hold a file per scheduled game
          # from before fetch_boxscore stopped caching non-final answers.
          grep -rliE --include='*.json' '"gameState":[[:space:]]*"(OFF|FINAL)"' data/raw/nhl/boxscore 2>/dev/null | wc -l \
            | xargs echo "Cached boxscores restored:" || true
          # If the chain broke, take the ledger from the card-feed branch
          # rather than starting the season's record over. Restoring a
          # slightly stale ledger is harmless — settlement is idempotent and
          # keyed by snapshot date, so it simply re-settles what it must —
          # while starting empty destroys evidence that cannot be rebuilt.
          if [ ! -f data/processed/forward_evidence.csv ]; then
            if git fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" \
                 +refs/heads/card-feed:refs/card-feed-tip 2>/dev/null \
               && git cat-file -e refs/card-feed-tip:forward_evidence.csv 2>/dev/null; then
              mkdir -p data/processed
              git show refs/card-feed-tip:forward_evidence.csv \
                > data/processed/forward_evidence.csv
              echo "::warning::The state artifact carried no forward ledger; restored it from the card-feed branch. The artifact chain broke somewhere."
              wc -l < data/processed/forward_evidence.csv \
                | xargs echo "Ledger rows restored from card-feed:"
            else
              echo "No forward ledger in the artifact or on card-feed. If this is not the first run, the season's ledger is gone."
            fi
          fi

      - name: Check the provider credential
        # Fails fast and legibly if the key was rotated without updating the
        # secret, rather than surfacing as a confusing provider error later.
        # Costs no quota and prints nothing about the key beyond whether it is
        # present. Deliberately hard: without a key there is no price fetch to
        # degrade to, and a dead credential must be loud.
        if: ${{ inputs.skip_provider_fetch != true }}
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py

      - name: Fetch results
        # The NHL API is public, keyless and free, and a completed boxscore is
        # never refetched. Fetched before any quota is spent, so an outage here
        # costs nothing.
        #
        # Soft: if this fails and the restored cache is present, the run
        # continues on slightly older results and says so. Fitting on results
        # a day old is a far better outcome than no card.
        #
        # Bounded in time, like Line Movement's schedule fetch. The client
        # makes four attempts at every request (a 30-second timeout each,
        # 2+4+8 seconds of backoff between them) and this fetch asks about
        # 160 schedules, rosters and registries live on every run, so an NHL
        # outage cost about 38 minutes on fast 503s and hours on a hanging
        # API. The job's 45 minutes ran out inside this step, before prices
        # or the card, and the day got no card and no snapshot. The fetch
        # itself is cut at 18 minutes by `timeout` below, so the datasets are
        # still rebuilt on whatever the cache holds; the step's own 20
        # minutes is a backstop if that ever fails to stop it. A healthy run
        # needs far less: the heavy first-of-season runs (600 new boxscores
        # plus every schedule, roster and registry) took 6 to 11 minutes on
        # 2026-08-25..28, and a steady-season run fetches about a dozen games.
        # Either way the step fails, and "Record what went wrong" calls a
        # failed or cancelled fetch degraded, so the 15:00 backup runs.
        id: results
        timeout-minutes: 20
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          # Three bounds, and all matter.
          #
          # 0.25 seconds rather than 0.05: a cold cache is about four thousand
          # requests and the first run at 0.05 was rate-limited into near-total
          # failure. The client retries a 429 now, but the cheaper fix is not
          # to earn one.
          #
          # --max-games caps the work per run so a run always finishes. At a
          # quarter-second apiece, four thousand games cannot be fetched
          # inside any sensible job timeout, and a run killed at the timeout
          # produces no card at all. A cold cache therefore fills over
          # consecutive days rather than in one heroic run; in steady season
          # there are about a dozen new games a night. A game the schedule
          # says has not been played is not asked for at all: it used to be,
          # every run, so a season's worth of future games was re-requested
          # nightly and could take the cap's places from real finals.
          #
          # The fetch fails when the NHL API could not be reached, and that
          # failure is what "Record what went wrong" reads to call the run
          # degraded. The datasets are rebuilt either way — whatever did
          # arrive is still worth fitting on — and the step then exits with
          # the fetch's code so the failure is not swallowed.
          #
          # 18 minutes, see above: TERM first, KILL 30 seconds later. Every
          # boxscore is cached as it arrives, so what came before the cut is
          # kept and fitted on. A cut exits 124 (137 if it had to KILL).
          code=0
          timeout --kill-after=30s 18m \
            python scripts/fetch_nhl_data.py --polite-seconds 0.25 --max-games 600 || code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::warning::The NHL fetch was still running after 18 minutes and was stopped; the NHL API is probably down. The datasets are rebuilt on the cached results."
          fi
          python scripts/build_datasets.py
          exit "$code"

      - name: Restore cached play-by-play
        # The NHL play-by-play the team ratings are built from, shared with
        # Publish Site and Shadow Stats, so a run fetches only new games.
        uses: actions/cache/restore@v4
        with:
          path: data/raw/nhl/play_by_play
          key: shadow-play-by-play-${{ github.run_id }}
          restore-keys: shadow-play-by-play-

      - name: Rate the teams on expected goals and goaltending
        # Cooper's decision of 2026-10-05: the card's team markets are priced
        # on the same ratings as the public site (models/team_ratings.py).
        # Free and keyless. Soft: on any failure the card prices the team
        # markets on goals and says so in its notes and in `team_ratings`.
        id: ratings
        timeout-minutes: 12
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          set -u
          if ! timeout --kill-after=30s 10m python scripts/run_shadow_stats.py --fetch --tables-only; then
            rm -f data/processed/shadow_team_ratings.json
            echo "::warning::The xG team ratings could not be built; the card prices team markets on goals."
            exit 1
          fi

      - name: Keep the play-by-play for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/nhl/play_by_play
          key: shadow-play-by-play-${{ github.run_id }}

      - name: Fetch prices into staging
        # Soft for the same reason: without fresh prices the card is refused,
        # and a blocked card that explains itself beats a red X with a
        # traceback.
        id: prices
        if: ${{ inputs.skip_provider_fetch != true }}
        continue-on-error: true
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          set +e
          # The cap is enforced against the pessimistic bound, every asked
          # market in every asked region: 19 markets x 2 regions = 38
          # credits an event, so 320 buys 8 events, the first eight by
          # face-off. The real bill is only what books actually quote (an
          # unquoted market costs nothing), but the cap stops at the bound.
          # Measured on the real 2026-27 club schedules, that clips 72 of the
          # 185 nights and leaves 254 games unpriced; on those nights every
          # market only this per-event fetch prices (the props, the
          # regulation three-way, team totals) is INCOMPLETE and excluded
          # from the card. 608 is the smallest cap that clips no night (16
          # games x 38). Raising the cap spends more credits and is Cooper's
          # decision, still pending, so 320 stands. (Until 2026-09-25 this
          # said the cap covered a sixteen-game slate: one region's
          # arithmetic. The cap was set that way on 2026-08-28, and us2 was
          # added the same day.)
          # The one-day horizon keeps the spend on today's slate — a 32-event
          # August board once starved the nearest nine games under the old
          # cap. Ceiling at this cap: about 326 credits a run (320
          # per-event, 6 bulk), and the backup trigger stands down after a
          # clean primary.
          python scripts/run_provider_shadow.py --live --props \
            --overwrite-staging --horizon-days 1 \
            --credit-cap "${{ inputs.props_credit_cap || '320' }}"
          code=$?
          set -e
          # 3 means there are no NHL games on the board. The off-season runs
          # from mid-June to early October, and a red run every day of it is a
          # red nobody reads on opening night.
          if [ "$code" -eq 3 ]; then
            echo "empty_slate=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No NHL games are scheduled, so there was nothing to price. Not a fault."
            exit 0
          fi
          # 4 means at least one per-event request failed (a 5xx, a 429, a
          # timeout, a 422 the core-market fallback could not recover). The
          # team prices and whatever did arrive are staged, so the card is
          # still built; the step still exits 4. It used to exit 0, which
          # made a run with every per-event request refused a clean run:
          # card-feed read degraded=false and the backup stood down. The note
          # says what is missing, and "Record what went wrong" carries it.
          if [ "$code" -eq 4 ]; then
            echo "The per-event price fetch failed for at least one game (the provider refused or did not answer; the errors are listed in provider_shadow_verification.md), so the props, the regulation three-way and the alternate ladders are missing for those games — absent, not unquoted, and not books declining to post them. If this run froze today's snapshot, it lacks them, and because the day's first snapshot stands, no later run today can add them." > price_fetch_incomplete.txt
            echo "::warning::Per-event prices are missing for at least one game; see the job summary."
          fi
          exit "$code"

      - name: Record what went wrong
        # One place that knows whether the run was degraded, so the summary,
        # the comment, and the exit status cannot disagree about it.
        id: health
        if: always()
        run: |
          set -u
          : > run_degraded.txt
          : > run_quiet.txt
          # `|| true`: under bash -eo pipefail (declared under `defaults:`
          # above), `grep` on a missing cache, or one holding no final game,
          # fails the substitution. That ends this step before it writes
          # `degraded` at all, so the coldest run would read as clean.
          #
          # FINAL boxscores only, the same states as nhl_api.game_is_final.
          # This counted every file, and until fetch_boxscore stopped caching
          # non-final answers the fetch left one per scheduled game, so a
          # thin history padded with a season of future games read as
          # healthy. A restored cache can still hold those files.
          games=$(grep -rliE --include='*.json' '"gameState":[[:space:]]*"(OFF|FINAL)"' data/raw/nhl/boxscore 2>/dev/null | wc -l || true)
          echo "Boxscores cached: $games"
          # 1000 is config.THIN_HISTORY_GAMES: the public board projects
          # nothing from a history below it either, and
          # tests/test_the_board_refuses_a_thin_history.py runs this step at
          # that line to keep the two in one place.
          if [ ! -f data/processed/player_game_logs.csv ]; then
            echo "No player logs: no prop can be priced, so no card can be built. The NHL API could not be reached and no previous cache was restored." >> run_degraded.txt
          elif [ "$games" -lt 1000 ]; then
            echo "Only $games games are cached, so the models are fitted on a thin history. The fetch is capped per run and the cache fills over consecutive days; this resolves itself." >> run_degraded.txt
          elif [ "${{ steps.results.outcome }}" = "failure" ] \
               || [ "${{ steps.results.outcome }}" = "cancelled" ]; then
            # fetch_nhl_data.py fails on results, rosters, or (since the live
            # season's name registry is asked again every run) the registry,
            # so this names all three and points at the log that says which.
            # `cancelled` too: a step stopped at its timeout-minutes is not
            # guaranteed to read `failure`, and a fetch that never finished
            # refreshed nothing it had not reached.
            echo "Results, rosters or player names could not be refreshed (the NHL fetch step's log says which, or that it was stopped for running too long); the models were fitted on the previously cached games, and a player new since the last registry refresh has no name to be priced under." >> run_degraded.txt
          fi
          # What the restore could not ask GitHub (restore_state.py
          # --problem-file). Nothing read it, so a restore that fell back to
          # an older or thinner state after a failed call finished green,
          # and a green run is never laid under anything: the snapshot it
          # missed was lost for good. Red, the next run lays every older
          # carrier down to the last good state underneath this one and
          # settles what it missed.
          if [ -s restore_problem.txt ]; then
            cat restore_problem.txt >> run_degraded.txt
            echo "The previous state was not fully restored, so a snapshot an earlier run froze may be missing here and did not settle. Because this run is degraded, the next one lays every earlier run's state down to the last successful one underneath it, and a snapshot frozen earlier than this run's replaces it and settles then." >> run_degraded.txt
          fi
          if [ "${{ steps.prices.outputs.empty_slate }}" = "true" ]; then
            echo "No NHL games are scheduled, so there was nothing to price. Not a fault." >> run_quiet.txt
          elif [ -s price_fetch_incomplete.txt ]; then
            # Before the generic failure below: this fetch staged prices, and
            # "built from whatever was already staged" would misdescribe it.
            cat price_fetch_incomplete.txt >> run_degraded.txt
          elif [ "${{ steps.prices.outcome }}" = "failure" ]; then
            echo "The price fetch failed, so the card was built from whatever was already staged. No price was invented." >> run_degraded.txt
          fi
          if [ -s run_degraded.txt ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            cat run_degraded.txt
          else
            echo "degraded=false" >> "$GITHUB_OUTPUT"
            echo "Nothing went wrong."
          fi

      - name: Rebuild the measurement reports
        # Soft: a measurement failure must never cost a card, and the card's
        # own gates do not depend on these reports.
        #
        # A REPORT MEASURED AGAINST PRICES IS REBUILT ONLY FROM PRICES THIS
        # RUNNER HOLDS. Every command here used to run unconditionally, and
        # the bought prices are not on this runner: the restore above takes
        # this workflow's own newest carrier and lays the purchase's state in
        # only when no Gameday run carries one, and the carrier it restores
        # (run 33142173149, 31,815,033 bytes against the purchase's
        # 86,454,131) holds neither price store. So every run measured
        # nothing and published it, exit 0, to the gameday-reports artifact:
        # "0 market(s) have any price-based evidence", a claims headline of
        # "nothing has been measured against real prices yet", and 12 of 12
        # markets "no price-based measurement exists" in the bundle, against
        # a committed record of ten measured markets (-0.3% over 25,911
        # `late` bets; `points` -4.4% over 6,194). Carrying the prices into
        # this job is not the fix: it uploads data/processed whole to a
        # public artifact every day, which would republish paid-for prices
        # daily for the season. So a store this runner does not hold leaves
        # the checkout's committed report standing, and the log says so.
        #
        # Soft, but not silent. With no id nothing could read this step's
        # outcome, so a rebuild that failed left the committed reports, or an
        # earlier run's, standing in this run's artifacts looking current,
        # and the run said it was clean. "Report the outcome" reads it now,
        # and fails the run without degrading it: a backup would rebuild with
        # the same scripts and fail the same way, so it is not sent for.
        id: rebuild
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_props_calibration.py --reuse-samples || \
            python scripts/run_props_calibration.py
          # A store holds prices when it has a row under its header. A file
          # test alone would take a header-only store for one, and measuring
          # it reads "nothing bought" exactly as an absent store did.
          holds_prices() {
            awk 'NR == 2 { found = 1; exit } END { exit !found }' "$1" 2>/dev/null
          }
          props=no
          team=no
          if holds_prices data/processed/historical_prop_prices.csv; then props=yes; fi
          if holds_prices data/processed/historical_team_prices.csv; then team=yes; fi
          if [ "$props" = yes ]; then
            # The window is named because the store holds two — 4.0 hours
            # before face-off and 9.5 — and `--phase auto` refuses to measure
            # the mixture. This step is soft, so an unnamed window would have
            # left the previous report in place looking current. `late` runs
            # last on purpose: every run writes the contract filename too.
            python scripts/run_player_props_backtest.py --phase card --label card
            python scripts/run_player_props_backtest.py --phase late
          else
            echo "::notice::No bought prop prices are on this runner (data/processed/historical_prop_prices.csv holds no row), so the props backtests were not rebuilt and the committed player_props_backtest.md and player_props_backtest_card.md stand. Measured here, they would report that nothing has been measured, which is false."
          fi
          if [ "$team" = yes ]; then
            # The team store holds two windows too, and prices captured after
            # face-off; the measurement now refuses an unnamed window rather
            # than taking the better of two moments. `late` is the window
            # nearest the card's and holds most of the store.
            python scripts/run_team_markets_measurement.py --reuse-samples --phase late || \
              python scripts/run_team_markets_measurement.py --phase late
          else
            echo "::notice::No bought team prices are on this runner (data/processed/historical_team_prices.csv holds no row), so the team measurement was not rebuilt and the committed team_markets_measurement.md stands."
          fi
          # The claims document summarises both measurements and covers
          # everything or is not the claims document, so it is rebuilt only
          # when both were; otherwise the committed one stands beside the
          # committed reports it was written from.
          if [ "$props" = yes ] && [ "$team" = yes ]; then
            python scripts/run_what_we_can_claim.py
          else
            echo "::notice::The claims document summarises both price measurements and this runner could not rebuild both, so the committed what_we_can_claim.md stands."
          fi
          # The bundle is assembled here because the shadow verification and
          # coverage reports only come from live runs, which only happen
          # where the key lives. This said it was "the one place every
          # evidence file exists at once"; it is not, because the bought
          # prices are not here. The bundle checksums the reports on disk and
          # names each verdict input it could not read, rather than reading
          # a measurement it does not have as no measurement.
          python scripts/run_allowlist_evidence.py

      - name: Render the card
        id: card
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_gameday_card.py

      - name: Record whether the card was built
        # "Record what went wrong" runs before the card, so on its own it can
        # never know the card crashed. It could not, and a crashed card was
        # published as a clean run. The post step reads this file too, so a
        # run with no card posts that instead of staying silent.
        #
        # Nor could it know the card came out BLOCKED: the card step exits 0
        # on a blocked card, rightly, and this step asked only for the exit.
        # A card blocked because the board priced 7 of the 8 scheduled games
        # (every market "Priced for 7 of 8 games") so published
        # `degraded: false`, finished green and stood the 15:00 backup down,
        # while the comment went out as a degraded run; the same card at
        # 15:00Z, with the eighth game posted, builds. A skip_provider_fetch
        # dispatch on a game day did the same with no prices at all, and one
        # dispatched before 13:30 UTC stood down both scheduled runs, leaving
        # the day no card and no frozen snapshot. The card now says in
        # `nothing_to_card` when its block is NOT a fault (the policy
        # allowlists nothing it may pick from, or no regular-season game is
        # left to card today, where a rerun would buy the slate again to
        # learn nothing), and every other blocked card degrades the run. An
        # empty slate, which the health step wrote to run_quiet.txt, stays
        # quiet as before.
        if: always()
        run: |
          if [ "${{ steps.card.outcome }}" != "success" ]; then
            echo "The card could not be rendered, so there is no card for today; no earlier card stands in for it." >> run_degraded.txt
          elif [ -s run_quiet.txt ]; then
            echo "No NHL games on the board, so a blocked card is not a fault."
          elif ! blocked=$(jq -r '
              if .card_generated == true or (.nothing_to_card // "") != "" then empty
              else "The card was blocked, so there is no card for today: "
                + ([.blockers[]? | tostring] | join(" "))
              end' data/outputs/gameday_card.json 2>/dev/null); then
            echo "The card step finished, but it left no card that could be read, so there is no card for today." >> run_degraded.txt
          elif [ -n "$blocked" ]; then
            printf '%s\n' "$blocked" >> run_degraded.txt
          fi

      - name: Settle the forward ledger
        # After the card froze today's opinions and results were fetched
        # earlier in the run, every pending snapshot whose games are final
        # settles into the accumulating ledger. This is the only possible
        # price evidence for the regulation three-way, which has never been
        # bought historically (it is per-event only and was never requested),
        # and the out-of-sample stream for everything else — losing it would
        # mean the season taught nothing.
        #
        # Soft so a settlement fault never costs the card. It exits non-zero
        # on purpose when it could not settle (a ledger or snapshot it cannot
        # read, a team map that resolves nothing, a ledger that would
        # shrink), and with no id that exit reached no one: the run finished
        # green and the ledger stopped growing. "Report the outcome" now
        # fails the run on it, without degrading it. Every one of those
        # faults is a property of the restored state and this step makes no
        # network call, so the backup would restore the same files, fail the
        # same way, and buy the prices again for nothing. Nothing that failed
        # to settle is marked settled, so a later run settles it once the
        # state is repaired.
        id: settle
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_forward_evidence.py

      - name: Report closing-line value
        # Scores every frozen opinion against the market's last word, from
        # the union of two PRIVATE sources in cooperross399/nhl-closing-lines:
        # the closing-line store Closing Lines writes (`main`), and Line
        # Movement's capture chain it is derived from (`movement`), so a round
        # the store has not received yet is still scored. Since stage two of
        # the chain's move there is no public copy of either. Offline and
        # read-only: it fetches no prices and spends nothing.
        #
        # FAILURES. A damaged snapshot, capture store or movement day exits
        # 2, which "Report the outcome" reads and fails the run on, without
        # degrading it: the backup would read the same damaged files, so it
        # is not sent for. A private source that is damaged (exit 2), that
        # turns the token away (exit 5), that cannot be read for want of a
        # token (exit 3), or a missing movement branch (chain exit 4) is the
        # same kind of fault and is treated the same way; each names itself
        # in the step's outputs (store_fault) for "Report the outcome". Only a
        # source GitHub could not be reached for (exit 1) degrades the run.
        #
        # WHAT LEAVES THIS STEP IS AGGREGATE. The report prints counts, rates
        # and intervals, never a price, a line or a book, and it is the only
        # thing this step writes that is published (card-feed, gameday-reports).
        # Both sources are pulled into $RUNNER_TEMP, OUTSIDE the workspace,
        # because "Upload the state for the next run" uploads data/processed
        # whole as the public gameday-state artifact, and both are deleted
        # when the report is done.
        # tests/test_closing_prices_never_reach_the_public_repo.py replays
        # this block and checks that no captured price is left anywhere in
        # the workspace.
        id: clv
        if: always()
        continue-on-error: true
        env:
          NHL_CLOSING_LINES_TOKEN: ${{ secrets.NHL_CLOSING_LINES_TOKEN }}
          PYTHONPATH: src
        run: |
          set -u
          STORE_DIR="${RUNNER_TEMP:?}/private-closing-store"
          CHAIN_DIR="${RUNNER_TEMP:?}/private-movement-chain"
          rm -rf "$STORE_DIR" "$CHAIN_DIR"
          mkdir -p "$STORE_DIR" "$CHAIN_DIR" data/processed
          # A restore of an older gameday-state may carry a capture store or
          # chain folders from before the move. They go first, so the report
          # reads only what THIS run fetched, and so they are not uploaded
          # again.
          rm -f data/processed/closing_line_captures.csv
          rm -rf data/processed/line_movement data/processed/deployment data/processed/line_combinations
          UNREACHABLE=""
          STORE_FAULT=""
          STORE_TAG=""
          note_fault() {  # $1 source, $2 exit
            case "$2" in
              2) STORE_FAULT="${STORE_FAULT:+$STORE_FAULT; }The private $1 has damaged day file(s), named above; its good days, if any, were still scored"
                 STORE_TAG="${STORE_TAG:-damaged-store}" ;;
              5) STORE_FAULT="${STORE_FAULT:+$STORE_FAULT; }The private $1 turned NHL_CLOSING_LINES_TOKEN away (expired, revoked, or not granted cooperross399/nhl-closing-lines); replace the secret"
                 STORE_TAG="rejected-token" ;;
              3) STORE_FAULT="${STORE_FAULT:+$STORE_FAULT; }NHL_CLOSING_LINES_TOKEN is not set, so the private $1 cannot be read; since stage two it is the only source of closing prices"
                 STORE_TAG="${STORE_TAG:-no-token}" ;;
              4) STORE_FAULT="${STORE_FAULT:+$STORE_FAULT; }The private repository has no movement branch; the chain has existed since 2026-10-02, so it was deleted or renamed: restore it from its history"
                 STORE_TAG="${STORE_TAG:-missing-chain}" ;;
              *) STORE_FAULT="${STORE_FAULT:+$STORE_FAULT; }The private $1 read exited $2, which this step does not know"
                 STORE_TAG="${STORE_TAG:-unexpected-exit-$2}" ;;
            esac
          }
          PULL=0
          python scripts/private_closing_store.py pull \
            --out "$STORE_DIR/closing_line_captures.csv" || PULL=$?
          case "$PULL" in
            0) if [ -s "$STORE_DIR/closing_line_captures.csv" ]; then
                 echo "Read the capture store from the private repository."
               else
                 STORE_FAULT="The private closing-line store read exited 0 and wrote no store"
                 STORE_TAG="empty-read"
               fi ;;
            2) note_fault "closing-line store" 2 ;;
            3) note_fault "closing-line store" 3 ;;
            4) echo "The private capture store holds nothing yet." ;;
            1) UNREACHABLE="the private closing-line store" ;;
            *) note_fault "closing-line store" "$PULL" ;;
          esac
          if [ ! -s "$STORE_DIR/closing_line_captures.csv" ]; then
            rm -f "$STORE_DIR/closing_line_captures.csv"
          fi
          CHAIN=0
          python scripts/private_movement_chain.py pull --dest "$CHAIN_DIR" || CHAIN=$?
          case "$CHAIN" in
            0) echo "Read $(ls "$CHAIN_DIR/line_movement" 2>/dev/null | wc -l | tr -d ' ') line-movement day file(s) from the private chain." ;;
            2) note_fault "movement chain" 2 ;;
            3) note_fault "movement chain" 3 ;;
            4) note_fault "movement chain" 4 ;;
            1) UNREACHABLE="${UNREACHABLE:+$UNREACHABLE and }the private movement chain" ;;
            *) note_fault "movement chain" "$CHAIN" ;;
          esac
          HAS_CHAIN=""
          if [ -n "$(ls -A "$CHAIN_DIR/line_movement" 2>/dev/null)" ]; then HAS_CHAIN=yes; fi
          if [ -s "$STORE_DIR/closing_line_captures.csv" ] && [ -n "$HAS_CHAIN" ]; then
            SCORED="the closing-line value report scored the store and the movement chain"
          elif [ -s "$STORE_DIR/closing_line_captures.csv" ]; then
            SCORED="the closing-line value report scored the store alone"
          elif [ -n "$HAS_CHAIN" ]; then
            SCORED="the closing-line value report scored the movement chain alone"
          else
            SCORED="the closing-line value report scored no closing price"
          fi
          if [ -n "$UNREACHABLE" ]; then
            echo "GitHub could not be reached for $UNREACHABLE, so $SCORED today." >> run_degraded.txt
          fi
          # An array, so a path with a space in it stays one argument.
          SOURCES=(--captures-dir "$CHAIN_DIR")
          if [ -s "$STORE_DIR/closing_line_captures.csv" ]; then
            SOURCES=(--captures-dir "$STORE_DIR" "${SOURCES[@]}")
          fi
          # Under `bash -e` a bare failing command would end the step here and
          # skip the clean-up below; the status is kept and returned instead.
          CLV_STATUS=0
          python scripts/run_closing_line_value.py "${SOURCES[@]}" || CLV_STATUS=$?
          rm -rf "$STORE_DIR" "$CHAIN_DIR"
          if [ -n "$STORE_FAULT" ]; then
            echo "::error::$STORE_FAULT; $SCORED."
            echo "store_fault=$STORE_TAG" >> "${GITHUB_OUTPUT:-/dev/null}"
            if [ "$CLV_STATUS" -eq 0 ]; then CLV_STATUS=2; fi
          fi
          exit $CLV_STATUS

      - name: Upload the state for the next run
        # The boxscore cache and the previous card are the only link between
        # one gameday and the next, which is why they outlive the reports. The
        # card in particular: without it the "selections changed" marker cannot
        # mean anything.
        #
        # Here, straight after the last step that writes state and before
        # anyone is told how the run went. It used to run after the card-feed
        # publish, and nothing read its outcome: an upload that failed left
        # card-feed saying `degraded: false`, the 15:00 backup's precheck read
        # a clean card and stood down, and the next day restored yesterday's
        # state, with today's frozen snapshot missing from the chain for good.
        # `continue-on-error` so the step below records the failure and the
        # run degrades, rather than the upload ending the job's say in it.
        #
        # data/staging is today's slate as "Fetch prices into staging" quoted
        # it (the restore step clears any earlier run's copy first), and it
        # travels here because Publish Site builds the board from this
        # artifact alone. Without it every regular-season game from opening
        # night was published unpriced, with no line and no pick, while the
        # card beside it held a best bet: the prices never left the runner.
        # These are the live quotes of one run, overwritten every run: on
        # opening night, 486 team rows and 11,348 prop rows for five games,
        # per book, in a public artifact for 90 days like the rest of this
        # state. Not the bought historical stores, which this runner never
        # holds (see "Rebuild the measurement reports").
        id: state
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gameday-state
          path: |
            data/raw/nhl/boxscore
            data/raw/nhl/registry
            data/processed
            data/outputs/gameday_card.json
            data/outputs/prop_calibration_samples.csv
            data/outputs/team_market_samples.csv
            data/archive/priced_snapshots
            data/processed/forward_evidence.csv
            data/staging
          if-no-files-found: warn
          retention-days: 90

      - name: Record whether the state was saved
        # Anything but a clean upload is a degraded run, so the summary, the
        # comment, card-feed's status and the run's exit all say so, and the
        # backup runs and carries today's state forward instead.
        if: always()
        run: |
          if [ "${{ steps.state.outcome }}" != "success" ]; then
            echo "The state for the next run could not be uploaded, so tomorrow's run would restore an older state and today's frozen snapshot would not settle. The backup run carries it forward instead." >> run_degraded.txt
          fi

      - name: Write the card to the run summary
        if: always()
        run: |
          {
            echo "## Gameday card"
            echo
            cat data/outputs/gameday_card.md 2>/dev/null || echo "No card was produced."
            echo
            echo "## What went wrong"
            echo
            if [ -s run_degraded.txt ]; then cat run_degraded.txt; else echo "Nothing."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post the card to the operating home
        # Delivery. GitHub emails everyone watching the issue, so commenting is
        # the whole mechanism: no SMTP server, no credentials, no third party.
        #
        # Normally only when the selections change — a card a day would train
        # the reader to ignore them. But a degraded run always posts, because
        # silence is only safe to read as "nothing moved" if anything going
        # wrong breaks the silence.
        # Only on the default branch. A run dispatched on a feature branch is
        # code nobody has reviewed: it still fetches, prices, gates and renders
        # the card (so a dispatch is a full rehearsal, and the card is in the
        # run summary), but it must not email its card to the operating home
        # as if it were today's. Until 2026-09-26 nothing here read the ref.
        # The comparison is the one Closing Lines makes for its hand-off, with
        # a schedule let through first: a scheduled run only ever runs on the
        # default branch, and `github.event.repository` is not something this
        # lab has seen populated on a cron run. Were it empty there, the ref
        # test alone would read `refs/heads/` and every scheduled run would
        # skip the post and the card-feed publish, silently, from opening
        # night. A dispatch that cannot read the default branch skips both
        # too, and "Report the outcome" fails that run by name.
        # tests/test_a_branch_run_never_publishes_the_card.py evaluates it.
        id: post
        if: always() && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.prices.outputs.empty_slate }}" = "true" ]; then
            echo "No NHL games are scheduled; there is no card to post."
            exit 0
          fi
          # The two reads below check their own exit status, so this step
          # fails closed whatever shell runs it, not only under the pipefail
          # declared at the top. Both used to be `$(producer | consumer)`,
          # which under GitHub's default `bash -e` takes the consumer's
          # status. `$(python … | tail -1)` let a post script that crashed
          # before deciding read as an empty decision. The step said "the run
          # was clean", stayed green, and card-feed recorded degraded=false,
          # so the 15:00 backup stood down. A decision is now the script's
          # last line only when the script succeeded, and only when that line
          # is `post` or `skip`. Anything else is a failed post, which the
          # final health reports.
          if ! POST_OUTPUT=$(python scripts/post_card_to_issue.py \
              --previous-json previous_card.json \
              --out card_comment.md --title-out card_title.txt \
              --body-out issue_body.md \
              --degraded-file run_degraded.txt --run-url "$RUN_URL" \
              ${{ inputs.force_post == true && '--force' || '' }}); then
            echo "::error::The post script failed before deciding; nothing was posted."
            exit 1
          fi
          DECISION=$(printf '%s\n' "$POST_OUTPUT" | tail -n 1)
          case "$DECISION" in
            post|skip) ;;
            *)
              echo "::error::The post script ended without a decision (post or skip); nothing was posted."
              exit 1
              ;;
          esac
          if [ "$DECISION" != "post" ]; then
            echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
            echo "Not posting: the run was clean and the selections did not change."
            exit 0
          fi
          # `decision=post` is recorded only once the comment is delivered.
          # It used to be written first, so a comment that failed still
          # published "post" and a clean status, and nothing noticed.
          echo "decision=post_failed" >> "$GITHUB_OUTPUT"
          # The title comes from the module so the two cannot drift apart and
          # start posting to different issues. Matched exactly against the open
          # issues rather than through the search API: the title contains an em
          # dash, and a search quietly returning nothing would create a
          # duplicate issue every run.
          #
          # The listing is its own command so that its failure is seen. As
          # `$(gh issue list … | jq …)` under `bash -e`, one HTTP 502 left
          # jq reading empty input, which jq answers with nothing and exit 0.
          # That read as "no home issue exists", so the step created, pinned
          # and commented on a second home, and recorded decision=post. A
          # listing that fails is now a failed post that opens nothing.
          TITLE=$(cat card_title.txt)
          if ! LISTING=$(gh issue list --state open --limit 200 --json number,title); then
            echo "::error::The open issues could not be listed, so the operating home could not be found. Nothing was posted rather than opening a second home."
            exit 1
          fi
          NUMBER=$(printf '%s' "$LISTING" | jq -r --arg t "$TITLE" \
            '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "Creating the operating-home issue."
            NUMBER=$(gh issue create --title "$TITLE" \
              --body-file issue_body.md | grep -o '[0-9]*$')
            gh issue pin "$NUMBER" || echo "Could not pin; not fatal."
          fi
          gh issue comment "$NUMBER" --body-file card_comment.md
          echo "decision=post" >> "$GITHUB_OUTPUT"
          echo "Card posted to issue #$NUMBER."

      - name: Record whether the card was delivered
        # The run's final health: everything "Record what went wrong" knew,
        # the card's outcome, and now the delivery's. The card-feed status and
        # the run's exit read this, not the check that ran before the card.
        id: final
        if: always()
        run: |
          if [ "${{ steps.post.outcome }}" = "failure" ]; then
            echo "The card could not be posted to the operating home." >> run_degraded.txt
          fi
          if [ -s run_degraded.txt ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            cat run_degraded.txt
          else
            echo "degraded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the card to the card-feed branch
        # The cloud morning-brief routine reads today's card from this branch
        # with the plain git credential a cloud session already holds for this
        # repository — no GitHub API call, no extra token, no laptop. Every
        # run publishes here, including "skip" runs, so a missing commit for
        # today means the workflow itself did not finish, which is exactly
        # what the brief should alarm on.
        #
        # Plumbing commits on purpose: the working tree is full of generated
        # files that must never reach a branch, and hash-object/mktree/
        # commit-tree build the two-file commit without touching it. Each
        # push parents on the current tip, so it is always a fast-forward —
        # never a force.
        #
        # Soft, because the reports and the state still upload after it, and
        # read by "Report the outcome": a push that failed left no status and
        # no ledger backup for today while the run finished green. Its
        # failure fails the run there. It is not written into the health,
        # which is what this step publishes and was decided before it ran.
        #
        # Only on the default branch, for the reason the post step gives and
        # one more. A branch run published today's date with degraded=false,
        # so main's next scheduled precheck read today's card as already
        # published and stood the whole run down; and main restores state only
        # from main's runs, so the branch's frozen snapshot never reached the
        # forward ledger. That day's opinions were lost for good. The status
        # line also records the ref that wrote it, which the precheck reads.
        # The condition is the post step's, character for character, and
        # "Report the outcome" reads a skip as a failure exactly when this
        # condition says the step should have run.
        id: cardfeed
        if: always() && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # The checkout deliberately drops its credential, so this step
          # authenticates its two git calls itself. The token is the run's
          # own, masked in logs, and dies with the runner.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          # Dated by the league day the card was built for: its generated_at
          # in America/New_York. This step runs last, after the state upload
          # and the post, and the clock here was the date until 2026-09-29:
          # a card built at 23:56 ET and published at 00:03 was stamped the
          # next day, and stood that day's runs down (see the precheck). With
          # no card on disk, the day this run started on; the clock now only
          # if even that is missing. `card_day` stays empty without a card,
          # and the precheck never counts a status whose card_day is not
          # today.
          CARD_DAY=""
          GENERATED=$(jq -r '.generated_at // ""' data/outputs/gameday_card.json 2>/dev/null || true)
          if [ -n "$GENERATED" ]; then
            CARD_DAY=$(TZ=America/New_York date -d "$GENERATED" +%F 2>/dev/null || true)
          fi
          DAY="$CARD_DAY"
          if [ -z "$DAY" ] && [ -s run_league_day.txt ]; then
            DAY=$(head -n 1 run_league_day.txt)
          fi
          if [ -z "$DAY" ]; then
            DAY=$(TZ=America/New_York date +%F)
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DECISION="${{ steps.post.outputs.decision || 'none' }}"
          if [ ! -f card_comment.md ]; then
            echo "No card comment was rendered this run." > card_comment.md
          fi
          jq -n \
            --arg date "$DAY" \
            --arg card_day "$CARD_DAY" \
            --arg decision "$DECISION" \
            --arg degraded "${{ steps.final.outputs.degraded || 'unknown' }}" \
            --arg empty_slate "${{ steps.prices.outputs.empty_slate || 'false' }}" \
            --arg run_url "$RUN_URL" \
            --arg ref "${{ github.ref }}" \
            '{date: $date, card_day: $card_day, decision: $decision,
              degraded: $degraded, empty_slate: $empty_slate,
              run_url: $run_url, ref: $ref}' > card_status.json
          BLOB_MD=$(git hash-object -w card_comment.md)
          BLOB_JSON=$(git hash-object -w card_status.json)
          ENTRIES=$(printf '100644 blob %s\tlatest_card_comment.md\n100644 blob %s\tlatest_status.json' \
            "$BLOB_MD" "$BLOB_JSON")
          # The forward ledger is the season's accumulating out-of-sample
          # record, and it otherwise lives only in run artifacts no routine
          # can reach. Published here so the weekly digest can track the
          # year over plain git. Absent early on a bare repository; that is
          # a state the readers are told to expect, not an error.
          if [ -f data/outputs/forward_evidence.md ]; then
            BLOB_FWD=$(git hash-object -w data/outputs/forward_evidence.md)
            ENTRIES=$(printf '%s\n100644 blob %s\tlatest_forward_evidence.md' \
              "$ENTRIES" "$BLOB_FWD")
          fi
          # The ledger itself, not just its report. It is carried between
          # runs only by the state artifact, and that chain has a single
          # point of failure: one restore that silently comes back empty and
          # the next upload replaces a season of settled opinions with a
          # day's. The prices those rows settled against are gone, so the
          # history cannot be rebuilt from anything. Here it survives a
          # broken chain, and the restore step reads it back.
          if [ -f data/outputs/closing_line_value.md ]; then
            BLOB_CLV=$(git hash-object -w data/outputs/closing_line_value.md)
            ENTRIES=$(printf '%s\n100644 blob %s\tlatest_closing_line_value.md' \
              "$ENTRIES" "$BLOB_CLV")
          fi
          if [ -f data/processed/forward_evidence.csv ]; then
            BLOB_LEDGER=$(git hash-object -w data/processed/forward_evidence.csv)
            ENTRIES=$(printf '%s\n100644 blob %s\tforward_evidence.csv' \
              "$ENTRIES" "$BLOB_LEDGER")
          fi
          TREE=$(printf '%s\n' "$ENTRIES" | git mktree)
          PARENT=""
          if git fetch "$REMOTE" +refs/heads/card-feed:refs/card-feed-tip 2>/dev/null; then
            PARENT=$(git rev-parse refs/card-feed-tip)
          fi
          export GIT_AUTHOR_NAME="Gameday Refresh" GIT_AUTHOR_EMAIL="actions@github.com"
          export GIT_COMMITTER_NAME="Gameday Refresh" GIT_COMMITTER_EMAIL="actions@github.com"
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "card $DAY ($DECISION)")
          else
            COMMIT=$(git commit-tree "$TREE" -m "card $DAY ($DECISION)")
          fi
          git push "$REMOTE" "$COMMIT:refs/heads/card-feed"
          echo "card-feed updated for $DAY (decision: $DECISION)."

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameday-reports
          path: |
            data/outputs/gameday_card.md
            data/outputs/gameday_card.json
            data/outputs/provider_shadow_verification.md
            data/outputs/provider_market_discovery.md
            data/outputs/props_calibration.md
            data/outputs/player_props_backtest.md
            data/outputs/team_markets_measurement.md
            data/outputs/what_we_can_claim.md
            data/outputs/allowlist_evidence_bundle.md
            data/outputs/allowlist_evidence_bundle.json
            data/outputs/forward_evidence.md
            data/outputs/forward_evidence.json
            data/outputs/closing_line_value.md
          if-no-files-found: warn
          retention-days: 30

      - name: Report the outcome
        # Last, and the only step that can fail the job. Everything above is
        # allowed to degrade so the card still gets built, summarised and
        # delivered; the run then finishes red so the failure notice arrives.
        if: always()
        run: |
          echo "This job refetched results and prices and rebuilt reports."
          echo "It placed no bet, edited no policy, wrote no receipt,"
          echo "allowlisted no provider, and widened no market scope."
          # Degraded is checked FIRST, and an empty slate does not excuse it.
          # An in-season dark night is an ordinary empty slate — the league
          # does not play every night — and the empty-slate exit used to run
          # before this check, so a night with no games and a broken results
          # fetch finished green and silent. Half the season's nights are
          # dark; a fault that hides on them is a fault that hides.
          #
          # Every check below only records and prints; the step exits once,
          # after all of them, so a degraded run that also failed a report
          # or the card-feed publish names each failure rather than the first.
          failed=0
          if [ "${{ steps.final.outputs.degraded }}" != "false" ]; then
            echo "::error::This run was degraded (or its health was never recorded). See the job summary."
            failed=1
          fi
          # A card-feed publish that failed is a failed run, on a dark night
          # too: the morning brief reads today's card there and nowhere else.
          # It is reported as what it is, not as a degraded run. The health
          # was decided before the publish and the status it tried to publish
          # said so; a failed push published no status for today at all, so
          # the next trigger's precheck finds no clean card and the backup
          # runs.
          #
          # The settlement, the rebuild and the closing-line value report fail
          # the run the same way, and for the same reason are kept out of the
          # health: a backup would restore the same state, run the same
          # scripts on the same files and fail identically, so a degraded
          # status would only buy the prices again.
          # Only a FAILED rebuild is read: the step has no `if: always()`, so
          # it is skipped when an earlier step failed the job, which fails
          # the run on its own and has not run the rebuild at all.
          #
          # A skipped publish is a failure only where the publish was meant
          # to run: a schedule, or a run on the default branch -- the same
          # condition the post and card-feed steps carry. A dispatch on a
          # feature branch is a rehearsal that publishes nothing on purpose,
          # and a skip there is the gate working. A dispatch that cannot read
          # the default branch cannot tell which it is; both steps skipped,
          # and that is named here rather than passing as a rehearsal.
          PUBLISHES=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PUBLISHES=true
          elif [ -z "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::This run could not read the repository's default branch, so the post to the operating home and the card-feed publish were skipped as if it were a branch rehearsal. Nothing was delivered for today; dispatch again, or wait for the next scheduled run."
            failed=1
          elif [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            PUBLISHES=true
          else
            echo "::notice::Dispatched on ${{ github.ref }}, not the default branch: the card was built and gated as a rehearsal, and nothing was posted to the operating home or published to card-feed."
          fi
          if [ "$PUBLISHES" = true ] && [ "${{ steps.cardfeed.outcome }}" != "success" ]; then
            echo "::error::Today's card and status could not be published to the card-feed branch, so the morning brief has nothing to read for today and the forward ledger has no copy there. The run's own health (degraded=${{ steps.final.outputs.degraded }}) is unchanged; see the publish step's log."
            failed=1
          fi
          if [ "${{ steps.settle.outcome }}" = "failure" ]; then
            echo "::error::Settle the forward ledger failed (its log says why: a ledger or snapshot that could not be read, a team map that resolves nothing, or a ledger that would have shrunk), so finished games did not reach the out-of-sample record. Nothing that failed to settle was marked settled; it settles once the state is repaired. It is not written into the run's health (degraded=${{ steps.final.outputs.degraded }}), so on its own it sends for no backup."
            failed=1
          fi
          if [ "${{ steps.rebuild.outcome }}" = "failure" ]; then
            echo "::error::Rebuild the measurement reports failed (its log names the script), so a report in this run's artifacts may be the committed copy or an earlier run's, looking current. The card does not depend on them. It is not written into the run's health (degraded=${{ steps.final.outputs.degraded }}), so on its own it sends for no backup."
            failed=1
          fi
          # A failed CLV step is red whatever its fault; the fault only picks
          # the words, so no wording can turn the run green.
          if [ "${{ steps.clv.outcome }}" = "failure" ]; then
            case "${{ steps.clv.outputs.store_fault }}" in
              rejected-token)
                WHY=" because the private repository turned NHL_CLOSING_LINES_TOKEN away (expired, revoked, or not granted cooperross399/nhl-closing-lines). Replace the secret. Both closing-price sources live there, so today's closing-line value is incomplete or missing." ;;
              missing-chain)
                WHY=" because the private repository cooperross399/nhl-closing-lines has no movement branch. The chain has existed since 2026-10-02, so it was deleted or renamed: restore it from its history. Today's closing-line value scored the store alone, if at all." ;;
              no-token)
                WHY=" because NHL_CLOSING_LINES_TOKEN is not set, so the private repository cooperross399/nhl-closing-lines could not be read. Set the secret. Both closing-price sources live there, so today's closing-line value is incomplete or missing." ;;
              *)
                WHY=" (its log names the cause: a damaged snapshot, movement day or capture store, or a private store that could not be used), so today's closing-line value is incomplete or missing." ;;
            esac
            echo "::error::Report closing-line value failed${WHY} It is not written into the run's health (degraded=${{ steps.final.outputs.degraded }}), so on its own it sends for no backup."
            failed=1
          fi
          if [ "$failed" != 0 ]; then
            exit 1
          fi
          if [ "${{ steps.prices.outputs.empty_slate }}" = "true" ]; then
            echo "::notice::No NHL games on the slate. Nothing to price, and nothing wrong."
            exit 0
          fi
          echo "Clean run."
