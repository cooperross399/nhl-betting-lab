name: Closing Lines

# Captures what the market is showing, repeatedly, through the evening. The
# closing price for a game is the last capture strictly before its start, and
# NHL puck drops run from 19:00 to 22:30 Eastern — so one fetch would be a
# closing line for the early games and a three-hour-early one for the rest.
#
# SCOPE: this records prices. It builds no card, places no bet, allowlists
# nothing, edits no policy, and cannot change a selection. Every capture
# happens hours after the card's opinion was already frozen, which is exactly
# what makes the comparison meaningful.
#
# WHY IT IS WORTH THE CREDITS: the price backtest needs thousands of settled
# bets before its interval stops including zero. Closing-line value answers a
# narrower question on a fraction of the sample, and it is the earliest
# honest signal that a model is finding something — or that a winning month
# is variance.
#
# It writes to its own branch, never to card-feed, so it can never race the
# daily card publish.

on:
  # SCHEDULE RETIRED 2026-08-29. Line Movement Capture now performs one
  # fetch and writes both stores: every book's every rung for movement
  # analysis, and the best price per selection for this one. For the
  # per-event markets, two schedules were asking the provider the same
  # question and paying twice. NOT for the bulk moneyline, puck line and
  # total, which only this workflow's capture asked for: since the
  # retirement nothing captures them, so no moneyline opinion can meet a
  # closing price (found 2026-09-25; capturing them spends credits, so it
  # is Cooper's call). This workflow stays dispatchable so a capture can still be
  # forced by hand, and the history of why the old grid looked the way
  # it did is in git rather than in a comment above a dead trigger.
  #
  # AND THE HAND-OFF, SINCE 2026-09-24. Retiring the schedule retired this
  # branch's only writer: Line Movement wrote the closing prices on its
  # runner and nothing published them, so every in-season CLV report would
  # have read an empty store. Now each Line Movement run hands its closing
  # prices over as an artifact, and this workflow publishes them. That path
  # fetches nothing, reads no secret and spends no credit.
  workflow_run:
    workflows: ["Line Movement Capture"]
    types: [completed]
  workflow_dispatch:
    inputs:
      credit_cap:
        description: "Hard cap on per-event credits for this capture"
        type: string
        required: false
        default: "400"

permissions:
  # Write, for exactly one ref: the closing-lines branch, which is this
  # workflow's own store. It never touches card-feed or main.
  contents: write
  # To download the closing prices a Line Movement run handed over.
  actions: read

concurrency:
  group: closing-lines
  cancel-in-progress: false

jobs:
  capture:
    name: Capture closing lines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A hand-off is published only from Line Movement's own runs on the
    # default branch. A dispatch of it on a feature branch captures with code
    # nobody has reviewed, and the store is append-only.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.head_branch == github.event.repository.default_branch

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the capture store
        # Not on a hand-off: there the publish step below merges the handed
        # rows into the branch tip itself, which is what it already does on
        # every retry.
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          mkdir -p data/processed
          # Two very different situations used to take the same branch: "the
          # store does not exist yet" and "the fetch failed". The second one
          # then published a single night's rows over the whole append-only
          # history, as a perfectly legal fast-forward. So the ref is probed
          # first, and anything but a genuinely absent branch is a hard stop.
          if git ls-remote --exit-code --heads "$REMOTE" closing-lines >/dev/null 2>&1; then
            git fetch "$REMOTE" +refs/heads/closing-lines:refs/closing-tip || {
              echo "::error::The closing-lines branch exists but could not be fetched. Refusing to run: publishing now would replace the season's captures with this one run."
              exit 1
            }
            git show refs/closing-tip:closing_line_captures.csv > restored.csv || {
              echo "::error::The closing-lines branch carries no capture file. Refusing to overwrite it blindly."
              exit 1
            }
            # Through a temp file: a half-written store that becomes the next
            # baseline is the same data loss by a slower route.
            mv restored.csv data/processed/closing_line_captures.csv
            wc -l < data/processed/closing_line_captures.csv \
              | xargs echo "Capture rows restored:"
          else
            echo "No capture store yet. This run establishes it."
          fi

      - name: Take the closing prices Line Movement handed over
        id: handoff
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p data/processed
          # "Handed nothing over" and "could not fetch what was handed over"
          # are different, and only the first is an ordinary night. So the
          # artifact is looked up first; a download that then fails is a
          # hard stop, because that run's closing prices are otherwise gone.
          found=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "closing-line-captures") | select(.expired | not)] | length')
          if [ "$found" = "0" ]; then
            echo "::notice::Line Movement run $RUN_ID handed over no closing prices (no games, or its capture wrote nothing). Nothing to publish."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$RUN_ID" --name closing-line-captures --dir data/processed --repo "${{ github.repository }}"
          rows=$(( $(wc -l < data/processed/closing_line_captures.csv) - 1 ))
          echo "Line Movement run $RUN_ID handed over $rows closing-price row(s)."
          if [ "$rows" -le 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture
        id: capture
        # Never on a hand-off: Line Movement already paid for these prices.
        if: github.event_name != 'workflow_run'
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          set +e
          python scripts/capture_closing_lines.py --live \
            --credit-cap "${{ inputs.credit_cap || '400' }}"
          code=$?
          set -e
          # 3 means no games today. The league does not play every night and
          # a red run on every dark night is a red nobody reads in April.
          if [ "$code" -eq 3 ]; then
            echo "empty_slate=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No NHL games today, so there was nothing to capture."
            exit 0
          fi
          exit "$code"

      - name: Publish the store
        if: steps.capture.outputs.empty_slate != 'true' && steps.handoff.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          export GIT_AUTHOR_NAME="Closing Lines" GIT_AUTHOR_EMAIL="actions@github.com"
          export GIT_COMMITTER_NAME="Closing Lines" GIT_COMMITTER_EMAIL="actions@github.com"
          cp data/processed/closing_line_captures.csv mine.csv
          # The tree is rebuilt inside the loop, not hashed once outside it.
          # Hashing before the loop meant a retry after a rejected push
          # re-offered the same content, silently discarding whatever capture
          # had landed in between — the one thing the retry exists to stop.
          for attempt in 1 2 3; do
            PARENT=""
            if git fetch "$REMOTE" +refs/heads/closing-lines:refs/closing-tip 2>/dev/null; then
              PARENT=$(git rev-parse refs/closing-tip)
              if git show refs/closing-tip:closing_line_captures.csv > theirs.csv 2>/dev/null; then
                PYTHONPATH=src python scripts/merge_capture_store.py \
                  --mine mine.csv --theirs theirs.csv \
                  --out data/processed/closing_line_captures.csv || exit 1
              else
                # The restore step refuses this on a dispatch; a hand-off
                # skips the restore, so the refusal lives here too. Skipping
                # the merge would publish one run's rows over the branch.
                echo "::error::The closing-lines branch exists but carries no capture file. Refusing to overwrite it blindly."
                exit 1
              fi
            fi
            BLOB=$(git hash-object -w data/processed/closing_line_captures.csv)
            TREE=$(printf '100644 blob %s\tclosing_line_captures.csv\n' "$BLOB" | git mktree)
            if [ -n "$PARENT" ]; then
              COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "captures $(date -u +%FT%TZ)")
            else
              COMMIT=$(git commit-tree "$TREE" -m "captures $(date -u +%FT%TZ)")
            fi
            if git push "$REMOTE" "$COMMIT:refs/heads/closing-lines"; then
              echo "Capture store published (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected; refetching the tip and re-merging."
          done
          echo "::error::Could not publish the capture store after three attempts."
          exit 1

      - name: Report the outcome
        if: always()
        run: |
          echo "This job recorded prices. It placed no bet, built no card,"
          echo "allowlisted nothing, and changed no selection."
