name: Closing Lines

# Captures what the market is showing, repeatedly, through the evening. The
# closing price for a game is the last capture strictly before its start, and
# NHL puck drops run from 19:00 to 22:30 Eastern — so one fetch would be a
# closing line for the early games and a three-hour-early one for the rest.
#
# SCOPE: this records prices. It builds no card, places no bet, allowlists
# nothing, edits no policy, and cannot change a selection. Every capture
# happens hours after the card's opinion was already frozen, which is exactly
# what makes the comparison meaningful.
#
# WHY IT IS WORTH THE CREDITS: the price backtest needs thousands of settled
# bets before its interval stops including zero. Closing-line value answers a
# narrower question on a fraction of the sample, and it is the earliest
# honest signal that a model is finding something — or that a winning month
# is variance.
#
# WHERE IT WRITES: the PRIVATE repository cooperross399/nhl-closing-lines, and
# nowhere else. This repository is public, and a store here (a branch, a
# release, a Pages site or an artifact) would be a permanent, downloadable
# file of captured odds, which The Odds API's terms forbid.
# `scripts/private_closing_store.py` refuses this repository as a target by
# name and asks the GitHub API that the store is private before every push.
# This workflow holds no write grant on this repository at all.
# `tests/test_closing_prices_never_reach_the_public_repo.py` holds all of it.
#
# WHERE IT READS: the rows it pushes are derived from Line Movement's chain,
# which since stage two of the move lives only on branch `movement` of the
# same private repository (CLAUDE.md). It never touches a public artifact.
#
# Disabled from 2026-09-25 (#126) to 2026-10-02, and again from 2026-10-05
# while NHL_CLOSING_LINES_TOKEN was a value GitHub rejected (401); whether it
# is on now is GitHub's state, not this comment's.
#
# THE SECRET: `NHL_CLOSING_LINES_TOKEN`, a fine-grained token limited to
# cooperross399/nhl-closing-lines with Contents read and write. Without it
# the publish step fails red and publishes nothing anywhere.

on:
  # SCHEDULE RETIRED 2026-08-29. Line Movement Capture now performs one
  # fetch and writes both stores: every book's every rung for movement
  # analysis, and the best price per selection for this one. For the
  # per-event markets, two schedules were asking the provider the same
  # question and paying twice. The bulk moneyline, puck line and total,
  # which only this workflow's capture asked for, went uncaptured from the
  # retirement (found 2026-09-25) until Line Movement added them to each of
  # its rounds, so they now reach the same hand-off as the per-event
  # prices. This workflow stays dispatchable so a capture can still be
  # forced by hand, and the history of why the old grid looked the way
  # it did is in git rather than in a comment above a dead trigger.
  #
  # AND THE HAND-OFF. Retiring the schedule retired this store's only
  # writer: Line Movement wrote the closing prices on its runner and nothing
  # published them. From 2026-09-24 to 2026-10-01 each Line Movement run
  # uploaded them as a `closing-line-captures` artifact for this workflow to
  # take, which was itself a downloadable odds file on a public repository.
  # From 2026-10-01 it read the public `line-movement` artifact instead.
  # Since stage two of the chain's move, Line Movement keeps no public copy:
  # this workflow pulls the chain from branch `movement` of the private
  # repository onto its own runner (it uploads nothing), derives the closing
  # prices from it (`closing_lines.load_movement_captures`, the same rows by
  # construction), and pushes them to the private store's `main`. That path
  # fetches nothing from the provider and spends no credit.
  workflow_run:
    workflows: ["Line Movement Capture"]
    types: [completed]
  workflow_dispatch:
    inputs:
      credit_cap:
        description: "Hard cap on per-event credits for this capture"
        type: string
        required: false
        default: "400"

permissions:
  # Read only. The store and the chain are in another repository, reached
  # with NHL_CLOSING_LINES_TOKEN, so this workflow needs no grant here
  # beyond reading its own code.
  contents: read

concurrency:
  group: closing-lines
  cancel-in-progress: false

jobs:
  capture:
    name: Capture closing lines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A hand-off is published only from Line Movement's own runs on the
    # default branch. A dispatch of it on a feature branch captures with code
    # nobody has reviewed, and the store is append-only.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.head_branch == github.event.repository.default_branch

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Take the chain from the private repository
        # Every day the chain carries, pulled onto this runner and nowhere
        # else (this workflow uploads nothing). A chain with no price file yet
        # publishes nothing and stays green. A chain that could not be read,
        # or a repository with no movement branch at all (deleted or renamed:
        # it has existed since 2026-10-02), is a red run, because the rounds
        # since the last push would otherwise be skipped quietly (they heal
        # on the next push that can read it: each push reads every day).
        id: handoff
        if: github.event_name == 'workflow_run'
        env:
          NHL_CLOSING_LINES_TOKEN: ${{ secrets.NHL_CLOSING_LINES_TOKEN }}
          PYTHONPATH: src
        run: |
          set -u
          mkdir -p data/processed
          CODE=0
          python scripts/private_movement_chain.py pull --dest data/processed || CODE=$?
          if [ "$CODE" = 4 ]; then
            echo "::error::The private repository has no movement branch. The chain has existed since 2026-10-02, so it was deleted or renamed; restore it from its history."
            exit 1
          fi
          if [ "$CODE" = 0 ] && [ ! -d data/processed/line_movement ]; then
            echo "::notice::The private chain holds no price captures yet. Nothing to publish."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != 0 ]; then
            echo "::error::The private movement chain could not be read (exit $CODE)."
            exit 1
          fi
          echo "Took $(ls data/processed/line_movement | wc -l | tr -d ' ') line-movement day file(s) from the private chain."

      - name: Capture
        id: capture
        # Never on a hand-off: Line Movement already paid for these prices.
        if: github.event_name != 'workflow_run'
        env:
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          set +e
          python scripts/capture_closing_lines.py --live \
            --credit-cap "${{ inputs.credit_cap || '400' }}"
          code=$?
          set -e
          # 3 means no games today. The league does not play every night and
          # a red run on every dark night is a red nobody reads in April.
          if [ "$code" -eq 3 ]; then
            echo "empty_slate=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No NHL games today, so there was nothing to capture."
            exit 0
          fi
          exit "$code"

      - name: Publish to the private store
        # To cooperross399/nhl-closing-lines and nowhere else; the script
        # refuses this repository by name and a store that is not private.
        if: steps.capture.outputs.empty_slate != 'true' && steps.handoff.outputs.empty != 'true'
        env:
          NHL_CLOSING_LINES_TOKEN: ${{ secrets.NHL_CLOSING_LINES_TOKEN }}
          PYTHONPATH: src
        run: python scripts/private_closing_store.py push --processed-dir data/processed

      - name: Report the outcome
        if: always()
        run: |
          echo "This job recorded prices. It placed no bet, built no card,"
          echo "allowlisted nothing, and changed no selection."
