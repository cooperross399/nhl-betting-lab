name: Due List Tuning

# Which Due List settings are best, checked on a season they were not chosen
# on? (Cooper, 2026-10-10.) Searches the qualifier, the drought bar and a price
# window on the bought prop prices, scores each season's winner on the other
# season, and runs the same search on simulated no-edge seasons.
# See scripts/run_due_list_tuning.py.
#
# With --history it also reads the NHL's free game logs back to 2009-10
# (rates only). It fetches no odds, spends no credit, places no bet, pushes nothing, uploads nothing,
# edits no policy and records no verdict the card reads. The bought prices
# are restored onto the runner and never leave it; the result is aggregate
# (bets, units, ROI, intervals) and goes to the run summary and the log only.
on:
  workflow_dispatch:
    inputs:
      history_from:
        description: "Also read the NHL's free game logs from this season's first year (e.g. 2014), rates only; empty skips it"
        required: false
        default: ""
  pull_request:
    paths:
      - "scripts/run_due_list_tuning.py"
      - "scripts/run_drought_rule_backtest.py"
      - "scripts/run_due_list_big_games.py"
      - "scripts/run_due_hot_research.py"
      - "scripts/run_due_list_refine.py"
      - "src/nhl_betting_lab/drought_rule.py"
      - ".github/workflows/due-list-tuning.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: due-list-tuning
  cancel-in-progress: false

jobs:
  measure:
    name: Due List Tuning
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the boxscores and the bought prices
        # As Experiment Refresh restores them. Bought prices cannot be
        # regenerated, so their absence stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for wf in gameday-refresh.yml historical-props-purchase.yml; do
            for name in gameday-state historical-props; do
              python scripts/restore_state.py --artifact "$name" --dest data \
                --workflow "$wf" --no-merge --refuse-unreachable --attempts 3 || {
                echo "::error::GitHub could not be reached to restore $name from $wf."
                exit 1
              }
            done
          done
          if [ ! -s data/processed/historical_prop_prices.csv ]; then
            echo "::error::The bought prop prices did not restore (they expire from CI on 2026-11-29), so there is nothing to price against."
            exit 1
          fi
          PYTHONPATH=src python scripts/build_datasets.py || true

      - name: Search the settings
        env:
          PYTHONPATH: src
          HISTORY_FROM: ${{ github.event.inputs.history_from }}
        run: |
          set -u
          status=0
          python scripts/run_due_list_tuning.py || status=$?
          if [ -s data/outputs/due_list_tuning.md ]; then
            cat data/outputs/due_list_tuning.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # The Due List backtest of the rule as it stands, so a rule change can be
          # re-measured without a local copy of the prices. Its JSON is the
          # aggregate data/outputs/drought_rule_backtest.json the card reads its
          # cell records from; it is printed between markers for committing.
          python scripts/run_drought_rule_backtest.py > /dev/null || status=$?
          # 2-goal games, hat tricks and shutouts (Cooper, 2026-11-04).
          history=()
          if [ -n "${HISTORY_FROM}" ]; then history=(--history "${HISTORY_FROM}"); fi
          python scripts/run_due_list_big_games.py --status "$(TZ=America/New_York date +%F)" "${history[@]}" > /dev/null || status=$?
          if [ -s data/outputs/due_list_big_games.md ]; then
            cat data/outputs/due_list_big_games.md >> "$GITHUB_STEP_SUMMARY"
            cat data/outputs/due_list_big_games.md
          fi
          if [ -s data/outputs/due_list_big_games_status.md ]; then
            cat data/outputs/due_list_big_games_status.md >> "$GITHUB_STEP_SUMMARY"
            cat data/outputs/due_list_big_games_status.md
          fi
          if [ -s data/outputs/due_list_big_games_history.md ]; then
            cat data/outputs/due_list_big_games_history.md >> "$GITHUB_STEP_SUMMARY"
            cat data/outputs/due_list_big_games_history.md
          fi
          # Where the Due List makes money, and a Hot List (Cooper, 2026-11-18).
          # This season's forward ledger is read from card-feed's day files.
          cf="$RUNNER_TEMP/card-feed"
          mkdir -p "$cf"
          if git fetch --depth 1 origin card-feed 2>/dev/null; then
            git --work-tree="$cf" checkout FETCH_HEAD -- forward_evidence 2>/dev/null || true
            git reset -q
          fi
          python scripts/run_due_hot_research.py --ledger-dir "$cf/forward_evidence" > /dev/null || status=$?
          if [ -s data/outputs/drought_rule_backtest.json ]; then
            echo "----- drought_rule_backtest.json -----"
            cat data/outputs/drought_rule_backtest.json
            echo "----- end drought_rule_backtest.json -----"
          fi
          # Refining 1+ assist and 1+ point to where they pay (Cooper, 2026-11-25).
          python scripts/run_due_list_refine.py --ledger-dir "$cf/forward_evidence" > /dev/null || status=$?
          if [ -s data/outputs/due_list_refine.md ]; then
            cat data/outputs/due_list_refine.md >> "$GITHUB_STEP_SUMMARY"
            echo "----- due_list_refine.md -----"
            cat data/outputs/due_list_refine.md
            echo "----- end due_list_refine.md -----"
          fi
          # Printed last, so the research is the end of the log.
          if [ -s data/outputs/due_hot_research.md ]; then
            cat data/outputs/due_hot_research.md >> "$GITHUB_STEP_SUMMARY"
            echo "----- due_hot_research.md -----"
            cat data/outputs/due_hot_research.md
          fi
          # The bought prices leave the workspace before the job ends.
          rm -f data/processed/historical_prop_prices.csv
          exit "$status"
