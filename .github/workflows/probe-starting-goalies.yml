name: Probe starting goalies (temporary)
on:
  push:
    branches: [claude/saves-need-the-starter]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump the page's payload shape
        run: |
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64)" -o page.html -w "%{http_code}\n" https://www.dailyfaceoff.com/starting-goalies
          python3 - <<'PY'
          import json, re
          html = open("page.html", encoding="utf-8", errors="replace").read()
          m = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html, re.S)
          print("next_data:", bool(m), "len", len(html))
          if not m:
              print(html[:3000]); raise SystemExit
          d = json.loads(m.group(1))
          pp = d.get("props", {}).get("pageProps", {})
          print("pageProps keys:", list(pp))
          def short(v, depth=0):
              if isinstance(v, dict):
                  return {k: short(x, depth + 1) for k, x in v.items()} if depth < 4 else "{...}"
              if isinstance(v, list):
                  return [short(v[0], depth + 1), f"...len {len(v)}"] if v else []
              return v
          for k, v in pp.items():
              print("==", k, type(v).__name__)
              print(json.dumps(short(v), indent=1, default=str)[:12000])
          PY
