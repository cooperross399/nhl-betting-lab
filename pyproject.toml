[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-betting-lab"
version = "0.1.0"
description = "Gated NHL player-prop and team-market research lab. Produces measured, calibrated cards; never places a bet."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "scipy>=1.13.0",
  "python-dotenv>=1.0.1",
  "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:nhl_betting_lab.*"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# A floor well below where the suite actually sits, not a target. Its job is
# to catch a module arriving with no tests at all, or a large deletion of
# them. Setting it at the current number would turn every honest refactor
# into a coverage negotiation, and would reward tests written to move a
# percentage rather than to catch a defect.
fail_under = 90
show_missing = true
skip_covered = true
