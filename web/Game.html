<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game breakdown — Maverick Hightower</title>
<meta name="description" content="One game in full: where the model's win chance comes from, factor by factor, and how the two teams compare.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lib/page.css">
<meta name="theme-color" content="#14151a">
</head>
<body>
<div class="wrap" id="root"><noscript>This page needs JavaScript to read tonight's board.</noscript></div>
<script type="module">
import { chrome, esc, pct, mult, signedPts, american, getJSON } from "./lib/page.js";

const METHOD = { strength: "xg", home_ice: "home-ice", form: "form", rest: "rest", lineup: "lineup", goalies: "goalies", referees: "referees", posthockey: "posthockey" };
const WHY = {
  strength: "Each team's recent shooter-adjusted expected goals for and against, with goaltending and finishing, on the league's home edge.",
  home_ice: "Each team's own home edge over the last two years, beyond the league's.",
  form: "Last five games against each team's own level, a quarter weight.",
  rest: "Back-to-backs, three or more days off, and crossing two or more time zones.",
  lineup: "Tonight's posted skaters against each club's usual eighteen, on offence and defence.",
  goalies: "Tonight's listed starters in place of each team's goalies together.",
  referees: "Tonight's crew's history of total goals. Moves the total, barely the winner.",
  posthockey: "Half way to PostHockey's own pre-game win probability.",
};

const params = new URLSearchParams(location.search);
const id = params.get("id") || "";
const date = params.get("date") || "";
const root = document.getElementById("root");

function teamChip(T, abbr) {
  const t = T[abbr] || {};
  return `<span class="chip" style="background:${esc(t.color || "#3a3d49")};color:${esc(t.fg || "#fff")}">${esc(abbr)}</span>`;
}

function waterfall(g, T) {
  const f = g.factors || [];
  if (!f.length) return `<p class="note">The breakdown is not available for this game: the card did not price its moneyline on this run.</p>`;
  const h = g.home.abbr, a = g.away.abbr, hc = (T[h] || {}).color || "var(--ink)", ac = (T[a] || {}).color || "var(--mute)";
  const rows = f.map((s, i) => {
    const p = s.homeWin, left = Math.min(p, 0.5), width = Math.abs(p - 0.5);
    const delta = i === 0 ? `${pct(p, 1)} ${h}` : signedPts(s.delta);
    const color = p >= 0.5 ? hc : ac;
    return `<div><a href="Methods.html#${METHOD[s.key] || ""}">${esc(s.label)}</a><div class="note">${esc(WHY[s.key] || "")}</div></div>
      <div class="bar" role="img" aria-label="${esc(h)} ${pct(p, 1)} after ${esc(s.label)}"><span style="left:${left * 100}%;width:${width * 100}%;background:${esc(color)}"></span><span class="mid"></span></div>
      <div class="mono" style="text-align:right">${delta}<div class="note">${pct(p, 1)}</div></div>`;
  }).join("");
  const last = f[f.length - 1];
  return `<div class="wf">${rows}</div>
    <p class="note">The bar is ${esc(h)}'s win chance after each layer, centred on a coin flip: right of the line favours ${esc(h)}, left favours ${esc(a)}. Each layer reprices the whole game, so the steps add up to the card's number, ${pct(last.homeWin, 1)} ${esc(h)}. Projected goals at the end: ${esc(h)} ${last.homeGoals ?? "—"}, ${esc(a)} ${last.awayGoals ?? "—"} in regulation.</p>`;
}

function comparison(g) {
  const R = g.ratings;
  if (!R) return `<p class="note">Team ratings are not available for this game.</p>`;
  const rows = [
    ["Attack (goals for vs league)", "attack", true, "Higher scores more. 1.08 is 8% above the league."],
    ["Defence (goals against vs league)", "defence", false, "Lower allows fewer. Goaltending is inside it."],
    ["Goaltending", "goaltending", false, "Goals allowed over expected, as a multiplier. Lower is better."],
    ["Form, attack (last five)", "formAttack", true, "Already inside Attack."],
    ["Form, defence (last five)", "formDefence", false, "Already inside Defence."],
  ].map(([label, key, high, note]) => {
    const av = R.away[key], hv = R.home[key];
    const better = typeof av === "number" && typeof hv === "number" && av !== hv ? ((av > hv) === high ? "away" : "home") : "";
    return `<tr><td>${label}<div class="note">${note}</div></td><td class="n ${better === "away" ? "better" : ""}">${mult(av)}</td><td class="n ${better === "home" ? "better" : ""}">${mult(hv)}</td></tr>`;
  }).join("");
  const ice = (x) => (typeof x === "number" ? `${x >= 0 ? "+" : "−"}${Math.abs(x * 100).toFixed(1)}%` : "—");
  return `<div class="scroll"><table><thead><tr><th></th><th class="n">${esc(g.away.abbr)}</th><th class="n">${esc(g.home.abbr)}</th></tr></thead><tbody>${rows}
    <tr><td>Own home ice<div class="note">Beyond the league's home edge. Only the home team's applies tonight.</div></td><td class="n">${ice(R.away.homeIce)}</td><td class="n">${ice(R.home.homeIce)}</td></tr></tbody></table></div>`;
}

function markets(g) {
  const out = [];
  const ml = g.moneyline;
  if (ml) {
    const c = ml.current || {}, f = ml.fair || {};
    const fmt = (v) => (typeof v === "number" ? (v > 0 ? `+${v}` : `−${Math.abs(v)}`) : "—");
    out.push(`<tr><td>Moneyline ${esc(g.away.abbr)}</td><td class="n">${pct(g.away.winProb, 1)}</td><td class="n">${fmt(f.away)}</td><td class="n">${fmt(c.away)}</td></tr>`);
    out.push(`<tr><td>Moneyline ${esc(g.home.abbr)}</td><td class="n">${pct(g.home.winProb, 1)}</td><td class="n">${fmt(f.home)}</td><td class="n">${fmt(c.home)}</td></tr>`);
  }
  if (g.puckLine) {
    const p = g.puckLine;
    out.push(`<tr><td>Puck line ${esc(p.favorite)} −1.5</td><td class="n">${pct(p.coverProb, 1)}</td><td class="n">${american(p.coverProb)}</td><td class="n">${typeof p.price === "number" ? (p.price > 0 ? `+${p.price}` : `−${Math.abs(p.price)}`) : "—"}</td></tr>`);
  }
  if (g.total) {
    const t = g.total;
    out.push(`<tr><td>Over ${esc(t.current)} (projected ${esc(t.proj)})</td><td class="n">${pct(t.overProb, 1)}</td><td class="n">${american(t.overProb)}</td><td class="n">${typeof t.overPrice === "number" ? (t.overPrice > 0 ? `+${t.overPrice}` : `−${Math.abs(t.overPrice)}`) : "—"}</td></tr>`);
  }
  if (!out.length) return `<p class="note">Not priced: no market price reached this board for this game. That is not a pass.</p>`;
  return `<div class="scroll"><table><thead><tr><th>Market</th><th class="n">Board's chance</th><th class="n">Fair price</th><th class="n">Best price</th></tr></thead><tbody>${out.join("")}</tbody></table></div>
    <p class="note">These are the board's own numbers. The card's pick below is priced on the full model in the breakdown above, so its chance can differ by a few points.</p>`;
}

function goalies(g) {
  const side = (s) => {
    const gl = (g[s] || {}).goalie;
    if (!gl || !gl.name) return `<div class="card"><b>${esc(g[s].abbr)}</b><div class="note">Goalie not confirmed.</div></div>`;
    return `<div class="card"><b>${esc(g[s].abbr)}</b> · ${esc(gl.name)} <span class="mute">${esc(gl.status === "confirmed" ? "Confirmed" : "Projected")}</span></div>`;
  };
  return `<div class="grid2">${side("away")}${side("home")}</div>`;
}

function pick(g) {
  const p = g.pick;
  if (!p) return g.priced ? `<p class="note">No pick: nothing on this game clears the bar.</p>` : `<p class="note">Not priced.</p>`;
  const price = p.price > 0 ? `+${p.price}` : `−${Math.abs(p.price)}`;
  return `<div class="card" style="border-color:var(--ink)"><div class="kicker" style="margin:0 0 6px">${p.kind === "lean" ? "Lean" : "Best bet"}</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase">${esc(p.label)}</div>
    <div class="mono mute">${esc(p.market)} · ${price} · edge ${esc(p.edgePct)}%</div></div>`;
}

async function main() {
  const board = await getJSON(date ? `./data/history/${encodeURIComponent(date)}.json` : "./data/board.json");
  const g = board && (board.games || []).find((x) => String(x.id) === id);
  if (!g) {
    root.innerHTML = chrome("Tonight") + `<main id="main"><div class="kicker">Game breakdown</div><h1>Not found.</h1><p class="lede">This game is not on ${date ? "that night's" : "tonight's"} board. <a href="Board.dc.html">Back to the board →</a></p></main>`;
    return;
  }
  const T = board.teams || {}, h = g.home.abbr, a = g.away.abbr;
  const name = (x) => (T[x] || {}).name || x;
  const when = new Date(g.startUtc).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.title = `${a} at ${h} — Maverick Hightower`;
  const hw = g.home.winProb, aw = g.away.winProb;
  const split = typeof hw === "number" ? `<div class="split" role="img" aria-label="${esc(a)} ${pct(aw)}, ${esc(h)} ${pct(hw)}"><div style="width:${aw * 100}%;background:${esc((T[a] || {}).color || "#80838e")}"></div><div style="width:${hw * 100}%;background:${esc((T[h] || {}).color || "#f1efe9")}"></div></div>
    <div class="mono" style="display:flex;justify-content:space-between"><span>${esc(a)} ${pct(aw)}</span><span>${esc(h)} ${pct(hw)}</span></div>` : `<p class="note">The model abstains on this game.</p>`;
  root.innerHTML = chrome("Tonight") + `<main id="main">
    <div class="kicker">${esc(when)} · ${esc(g.venue || "")}${g.tv ? ` · ${esc(g.tv)}` : ""}</div>
    <h1>${teamChip(T, a)} ${esc(name(a))}<br><span class="mute" style="font-size:.5em">at</span> ${teamChip(T, h)} ${esc(name(h))}</h1>
    <h2>The verdict</h2>${split}${pick(g)}
    <h2 id="breakdown">Where the number comes from</h2>${waterfall(g, T)}
    <h2>Team comparison</h2>${comparison(g)}
    <h2>Goalies tonight</h2>${goalies(g)}
    <h2>Markets</h2>${markets(g)}
    <footer class="note">Every number here is what the board published before the game. Nothing here is a bet; the site never places one. <a href="Methods.html">How every number is built →</a></footer>
  </main>`;
}
main();
</script>
</body>
</html>
